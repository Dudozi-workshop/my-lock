name: my_lock
version: 0.1.2+3
publish_to: none

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  sensors_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/shape_specs/soft_basic/
    - assets/shape_specs/crayon_soft/
    - assets/shape_masters/core/basic_v1/
    - assets/sea_turtle_runtime_v2/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/mylock_launcher_final.png"
  min_sdk_android: 21
