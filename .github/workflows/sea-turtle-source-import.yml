name: Sea Turtle v2 Source Import

on:
  push:
    branches:
      - chore/sea-turtle-v2-source-import
    paths:
      - '.github/source-payload/sea-turtle-v2-rot13/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=".github/source-payload/sea-turtle-v2-rot13"
          cat "$PAYLOAD"/part-*.txt > /tmp/sea_turtle_source.tar.gz.rot13
          tr 'A-Za-z' 'N-ZA-Mn-za-m' < /tmp/sea_turtle_source.tar.gz.rot13 > /tmp/sea_turtle_source.tar.gz.b64
          base64 --decode /tmp/sea_turtle_source.tar.gz.b64 > /tmp/sea_turtle_source.tar.gz
          echo "1fe0452fca9a2528a345dad1d16be3394be6912a9ce96f13632f0b732468ee47  /tmp/sea_turtle_source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/sea_turtle_pack_v2
          tar -xzf /tmp/sea_turtle_source.tar.gz -C /tmp/sea_turtle_pack_v2

      - name: Verify and import source pack
        run: |
          set -euo pipefail
          python3 tool/import_sea_turtle_master.py /tmp/sea_turtle_pack_v2
          python3 tool/validate_sea_turtle_master.py

      - name: Commit verified raw source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/source-payload/sea-turtle-v2
          rm -rf .github/source-payload/sea-turtle-v2-rot13
          rm -f .github/workflows/sea-turtle-source-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/shape_masters/drop01/sea_turtle_v2 .github tool
          git commit -m "chore(shape-master): commit Sea Turtle v2 raw source pack"
          git push origin HEAD:chore/sea-turtle-v2-source-import
