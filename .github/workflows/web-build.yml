name: MY LOCK Web Build

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'tool/**'
      - 'config/site_registry.json'
      - 'web/**'
      - 'wrangler.jsonc'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylock-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build and deploy Flutter Web
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate two-site governance
        run: python3 tool/validate_site_governance.py

      - name: Validate public preview routes
        run: python3 tool/validate_public_preview_routes.py

      - name: Build web
        run: bash tool/build_web.sh

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-web
          path: build/web
          if-no-files-found: error

      - name: Deploy to Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Publish canonical QA links
        if: always()
        run: |
          {
            echo "## MY LOCK Main Preview"
            echo ""
            echo "- Main: https://my-lock-preview.rlatkd5959.workers.dev/"
            echo "- Site metadata: config/site_registry.json"
            echo "- Route registry: docs/public-preview-routes.json"
          } >> "$GITHUB_STEP_SUMMARY"
