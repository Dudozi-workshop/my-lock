name: MY LOCK Web Build

# Sea Turtle lab branch uses an isolated preview worker.

on:
  push:
    branches: [main, feat/sea-turtle-runtime-poc]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'tool/**'
      - 'wrangler.jsonc'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylock-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build and deploy Flutter Web
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Build web
        run: bash tool/build_web.sh

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-web
          path: build/web
          if-no-files-found: error

      - name: Deploy main preview to Cloudflare Worker
        if: ${{ github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Install Wrangler for Sea Turtle Pages preview
        if: ${{ github.ref == 'refs/heads/feat/sea-turtle-runtime-poc' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm install --global wrangler@4

      - name: Ensure Sea Turtle Pages project
        if: ${{ github.ref == 'refs/heads/feat/sea-turtle-runtime-poc' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: wrangler pages project create my-lock-sea-turtle-preview --production-branch main || true

      - name: Deploy Sea Turtle lab to Cloudflare Pages
        if: ${{ github.ref == 'refs/heads/feat/sea-turtle-runtime-poc' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: wrangler pages deploy build/web --project-name my-lock-sea-turtle-preview --branch main --commit-dirty=true
