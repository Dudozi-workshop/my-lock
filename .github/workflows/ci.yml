name: MyLock CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: android
        type: choice
        options:
          - android
          - play
          - ios
          - all

concurrency:
  group: mylock-ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'push' }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'android' || github.event.inputs.target == 'all' }}
    name: Android test and ARM64 APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://dddpxudwfsydrhfgvvyn.supabase.co
      SUPABASE_BUCKET: my-lock-apk
      SUPABASE_OBJECT: my-lock-arm64-release.apk
      MYLOCK_UPLOAD_KEYSTORE_B64: ${{ secrets.MYLOCK_UPLOAD_KEYSTORE_B64 }}
      MYLOCK_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MYLOCK_UPLOAD_KEYSTORE_PASSWORD }}
      MYLOCK_UPLOAD_KEY_ALIAS: ${{ secrets.MYLOCK_UPLOAD_KEY_ALIAS }}
      MYLOCK_UPLOAD_KEY_PASSWORD: ${{ secrets.MYLOCK_UPLOAD_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap Android
        env:
          PLATFORMS: android
        run: bash tool/bootstrap.sh

      - name: Configure release signing
        if: ${{ env.MYLOCK_UPLOAD_KEYSTORE_B64 != '' && env.MYLOCK_UPLOAD_KEYSTORE_PASSWORD != '' && env.MYLOCK_UPLOAD_KEY_ALIAS != '' && env.MYLOCK_UPLOAD_KEY_PASSWORD != '' }}
        run: |
          set -e
          echo "$MYLOCK_UPLOAD_KEYSTORE_B64" | base64 --decode > android/app/mylock-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$MYLOCK_UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$MYLOCK_UPLOAD_KEY_PASSWORD
          keyAlias=$MYLOCK_UPLOAD_KEY_ALIAS
          storeFile=mylock-upload-key.jks
          EOF
          python3 - android/app/build.gradle.kts <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          header = """import java.io.FileInputStream
          import java.util.Properties

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          if "val keystoreProperties = Properties()" not in text:
              text = header + text
          if 'create("release")' not in text:
              signing = '''signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }

          '''
              text = text.replace("    buildTypes {", "    " + signing + "    buildTypes {", 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )
          path.write_text(text)
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build ARM64 APK only
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/my-lock-arm64-release.apk

      - name: Upload latest APK to Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail --show-error --silent             --request POST             --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             --header "apikey: $SUPABASE_SERVICE_ROLE_KEY"             --header "Content-Type: application/vnd.android.package-archive"             --header "x-upsert: true"             --data-binary @dist/my-lock-arm64-release.apk             "$SUPABASE_URL/storage/v1/object/$SUPABASE_BUCKET/$SUPABASE_OBJECT"

      - name: Verify Supabase APK
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          APK_URL="$SUPABASE_URL/storage/v1/object/public/$SUPABASE_BUCKET/$SUPABASE_OBJECT?v=$COMMIT_SHA"
          curl --fail --show-error --silent --location             --output /tmp/my-lock-arm64-release.apk "$APK_URL"
          cmp --silent dist/my-lock-arm64-release.apk /tmp/my-lock-arm64-release.apk

      - name: Build change summary
        id: change_summary
        run: |
          git log --no-merges -n 5 --pretty='- %s' "${GITHUB_SHA}" > /tmp/my-lock-change-summary.txt
          echo "summary_file=/tmp/my-lock-change-summary.txt" >> "$GITHUB_OUTPUT"

      - name: Email APK
        if: ${{ success() }}
        env:
          SMTP_USERNAME: ${{ secrets.APK_MAIL_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.APK_MAIL_APP_PASSWORD }}
          RECIPIENT: rlatkd5959@gmail.com
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APK_URL: https://dddpxudwfsydrhfgvvyn.supabase.co/storage/v1/object/public/my-lock-apk/my-lock-arm64-release.apk?v=${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          CHANGE_SUMMARY_FILE: ${{ steps.change_summary.outputs.summary_file }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          from datetime import datetime, timezone, timedelta
          from email.message import EmailMessage

          username = os.environ.get("SMTP_USERNAME", "")
          password = os.environ.get("SMTP_APP_PASSWORD", "")
          if not username or not password:
              raise SystemExit("APK mail secrets are not configured")

          commit_sha = os.environ["COMMIT_SHA"]
          build_time = os.environ.get("BUILD_TIME", "")
          apk_url = os.environ["APK_URL"]
          run_url = os.environ["RUN_URL"]

          with open(os.environ["CHANGE_SUMMARY_FILE"], "r", encoding="utf-8") as f:
              change_summary = f.read().strip()

          try:
              dt = datetime.fromisoformat(build_time.replace("Z", "+00:00"))
              display_time = dt.astimezone(
                  timezone(timedelta(hours=9))
              ).strftime("%Y-%m-%d %H:%M KST")
          except Exception:
              display_time = build_time or "unknown"

          msg = EmailMessage()
          msg["From"] = username
          msg["To"] = os.environ["RECIPIENT"]
          msg["Subject"] = f"MyLock APK | {display_time} | {commit_sha[:8]}"
          msg.set_content(
              "MyLock ARM64 APK 빌드가 완료되었습니다.\n\n"
              f"빌드 시각: {display_time}\n"
              f"커밋: {commit_sha}\n\n"
              f"변경사항\n{change_summary}\n\n"
              f"APK: {apk_url}\n"
              f"빌드 상세: {run_url}\n"
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(username, password)
              smtp.send_message(msg)
          PY

  play:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'play' || github.event.inputs.target == 'all') }}
    name: Play Store AAB
    runs-on: ubuntu-latest
    env:
      MYLOCK_UPLOAD_KEYSTORE_B64: ${{ secrets.MYLOCK_UPLOAD_KEYSTORE_B64 }}
      MYLOCK_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MYLOCK_UPLOAD_KEYSTORE_PASSWORD }}
      MYLOCK_UPLOAD_KEY_ALIAS: ${{ secrets.MYLOCK_UPLOAD_KEY_ALIAS }}
      MYLOCK_UPLOAD_KEY_PASSWORD: ${{ secrets.MYLOCK_UPLOAD_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap Android
        env:
          PLATFORMS: android
        run: bash tool/bootstrap.sh

      - name: Configure Play signing
        run: |
          set -e
          test -n "$MYLOCK_UPLOAD_KEYSTORE_B64"
          echo "$MYLOCK_UPLOAD_KEYSTORE_B64" | base64 --decode > android/app/mylock-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=$MYLOCK_UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$MYLOCK_UPLOAD_KEY_PASSWORD
          keyAlias=$MYLOCK_UPLOAD_KEY_ALIAS
          storeFile=mylock-upload-key.jks
          EOF
          python3 - android/app/build.gradle.kts <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          header = """import java.io.FileInputStream
          import java.util.Properties

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          if "val keystoreProperties = Properties()" not in text:
              text = header + text
          if 'create("release")' not in text:
              signing = '''signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }

          '''
              text = text.replace("    buildTypes {", "    " + signing + "    buildTypes {", 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )
          path.write_text(text)
          PY

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylock-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'ios' || github.event.inputs.target == 'all') }}
    name: iOS compile
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap iOS
        env:
          PLATFORMS: ios
        run: bash tool/bootstrap.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compile iOS without signing
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-ios-debug-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
