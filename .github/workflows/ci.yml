name: MY LOCK CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  android:
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'android' || github.event.inputs.target == 'all' }}
    name: Android analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap Android
        env:
          PLATFORMS: android
        run: bash tool/bootstrap.sh

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: my-lock-debug-keystore-v1

      - name: Build lightweight ARM64 release APK
        run: |
          set -e
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Prepare stable ARM64 APK filename
        run: |
          set -e
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/my-lock-arm64-release.apk

      - name: Upload ARM64 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-arm64-release-apk
          path: dist/my-lock-arm64-release.apk
          if-no-files-found: error

      - name: Publish latest ARM64 APK download
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          APK="dist/my-lock-arm64-release.apk"
          TAG="latest-apk"
          NAME="MY LOCK Latest ARM64 APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$NAME" --notes "Latest MY LOCK Android ARM64 release APK. Commit: $COMMIT_SHA"
          else
            gh release create "$TAG" "$APK" --title "$NAME" --notes "Latest MY LOCK Android ARM64 release APK. Commit: $COMMIT_SHA"
          fi

      - name: Verify public ARM64 APK download link
        run: |
          set -e
          APK_URL="https://github.com/${{ github.repository }}/releases/download/latest-apk/my-lock-arm64-release.apk"
          curl --fail --location --retry 3 --retry-delay 2 --output /tmp/my-lock-arm64-release.apk "$APK_URL"
          test -s /tmp/my-lock-arm64-release.apk

      - name: Email ARM64 APK download link
        if: ${{ success() }}
        env:
          SMTP_USERNAME: ${{ secrets.APK_MAIL_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.APK_MAIL_APP_PASSWORD }}
          RECIPIENT: rlatkd5959@gmail.com
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/latest-apk/my-lock-arm64-release.apk
          COMMIT_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          from datetime import datetime, timezone, timedelta
          from email.message import EmailMessage

          username = os.environ.get("SMTP_USERNAME", "")
          password = os.environ.get("SMTP_APP_PASSWORD", "")
          if not username or not password:
              raise SystemExit("APK mail secrets are not configured")

          commit_sha = os.environ["COMMIT_SHA"]
          build_time = os.environ.get("BUILD_TIME", "")
          apk_url = os.environ["APK_URL"]
          run_url = os.environ["RUN_URL"]
          try:
              dt = datetime.fromisoformat(build_time.replace("Z", "+00:00"))
              display_time = dt.astimezone(timezone(timedelta(hours=9))).strftime("%Y-%m-%d %H:%M KST")
          except Exception:
              display_time = build_time or "unknown"

          msg = EmailMessage()
          msg["From"] = username
          msg["To"] = os.environ["RECIPIENT"]
          msg["Subject"] = f"MY LOCK ARM64 Release APK | {display_time} | {commit_sha[:8]}"
          msg.set_content(
              "MY LOCK Android ARM64 Release APK 빌드와 다운로드 검증이 완료되었습니다.\n\n"
              f"최종 수정: {display_time}\n"
              f"커밋: {commit_sha}\n"
              f"ARM64 Release APK 바로 다운로드: {apk_url}\n"
              f"빌드 상세: {run_url}\n\n"
              "위 주소는 항상 최신 ARM64 Release APK로 갱신되며, 메일 발송 전에 실제 다운로드 가능 여부까지 검증합니다."
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(username, password)
              smtp.send_message(msg)
          PY

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'ios' || github.event.inputs.target == 'all') }}
    name: iOS analyze, test, compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap iOS
        env:
          PLATFORMS: ios
        run: bash tool/bootstrap.sh

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Compile iOS without signing
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-ios-debug-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
