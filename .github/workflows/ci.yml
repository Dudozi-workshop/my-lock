name: MY LOCK CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  android:
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'android' || github.event.inputs.target == 'all' }}
    name: Android analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap Android
        env:
          PLATFORMS: android
        run: bash tool/bootstrap.sh

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: my-lock-debug-keystore-v1

      - name: Build lightweight ARM64 release APK
        run: |
          set -e
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Upload ARM64 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Email latest APK
        if: ${{ success() }}
        env:
          SMTP_USERNAME: ${{ secrets.APK_MAIL_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.APK_MAIL_APP_PASSWORD }}
          RECIPIENT: rlatkd5959@gmail.com
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          APK_PATH: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          username = os.environ.get("SMTP_USERNAME", "")
          password = os.environ.get("SMTP_APP_PASSWORD", "")
          if not username or not password:
              raise SystemExit("APK mail secrets are not configured")

          recipient = os.environ["RECIPIENT"]
          run_url = os.environ["RUN_URL"]
          commit_sha = os.environ["COMMIT_SHA"]
          apk_path = Path(os.environ["APK_PATH"])
          if not apk_path.is_file():
              raise SystemExit(f"Built APK not found: {apk_path}")

          short_sha = commit_sha[:8]
          attachment_name = f"my-lock-{short_sha}-arm64-release.apk"

          msg = EmailMessage()
          msg["From"] = username
          msg["To"] = recipient
          msg["Subject"] = f"MY LOCK 최신 APK {short_sha}"
          msg.set_content(
              "이 메일에 첨부된 APK는 아래 커밋에서 직접 빌드된 파일입니다.\n\n"
              f"커밋: {commit_sha}\n"
              f"파일명: {attachment_name}\n"
              f"빌드 상세: {run_url}\n\n"
              "이전 Google Drive 고정 링크는 사용하지 않습니다."
          )
          msg.add_attachment(
              apk_path.read_bytes(),
              maintype="application",
              subtype="vnd.android.package-archive",
              filename=attachment_name,
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(username, password)
              smtp.send_message(msg)
          PY

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'ios' || github.event.inputs.target == 'all') }}
    name: iOS analyze, test, compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap iOS
        env:
          PLATFORMS: ios
        run: bash tool/bootstrap.sh

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Compile iOS without signing
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-ios-debug-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
