name: MY LOCK CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  android:
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'android' || github.event.inputs.target == 'all' }}
    name: Android analyze, test, build
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://dddpxudwfsydrhfgvvyn.supabase.co
      SUPABASE_BUCKET: my-lock-apk
      SUPABASE_OBJECT: my-lock-arm64-release.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap Android
        env:
          PLATFORMS: android
        run: bash tool/bootstrap.sh

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: my-lock-debug-keystore-v1

      - name: Build lightweight ARM64 release APK
        run: |
          set -e
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Prepare stable ARM64 APK filename
        run: |
          set -e
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/my-lock-arm64-release.apk

      - name: Upload latest ARM64 APK to Supabase Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          npm install --no-save --no-package-lock @supabase/supabase-js@2
          node <<'NODE'
          const fs = require('fs');
          const { createClient } = require('@supabase/supabase-js');

          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const bucket = process.env.SUPABASE_BUCKET;
          const objectName = process.env.SUPABASE_OBJECT;
          const apkPath = 'dist/my-lock-arm64-release.apk';

          if (!url || !key || !bucket || !objectName) {
            console.error('Supabase upload config is incomplete');
            process.exit(1);
          }

          const supabase = createClient(url, key, {
            auth: {
              persistSession: false,
              autoRefreshToken: false,
              detectSessionInUrl: false,
            },
          });

          (async () => {
            const bytes = fs.readFileSync(apkPath);
            const { data, error } = await supabase.storage
              .from(bucket)
              .upload(objectName, bytes, {
                contentType: 'application/vnd.android.package-archive',
                cacheControl: '60',
                upsert: true,
              });

            if (error) {
              console.error('Supabase Storage upload failed');
              console.error(JSON.stringify({
                name: error.name,
                message: error.message,
                status: error.status,
                statusCode: error.statusCode,
                error: error.error,
              }, null, 2));
              process.exit(1);
            }

            console.log('Supabase Storage upload succeeded:', data?.path || objectName);
          })().catch((error) => {
            console.error('Unexpected Supabase upload failure');
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify Supabase public APK download
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          APK_URL="$SUPABASE_URL/storage/v1/object/public/$SUPABASE_BUCKET/$SUPABASE_OBJECT?v=$COMMIT_SHA"
          curl --fail --show-error --location --retry 3 --retry-delay 2 \
            --output /tmp/my-lock-arm64-release.apk "$APK_URL"
          test -s /tmp/my-lock-arm64-release.apk
          echo "Local SHA256:"
          sha256sum dist/my-lock-arm64-release.apk
          echo "Downloaded SHA256:"
          sha256sum /tmp/my-lock-arm64-release.apk
          cmp --silent dist/my-lock-arm64-release.apk /tmp/my-lock-arm64-release.apk

      - name: Upload ARM64 release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-arm64-release-apk
          path: dist/my-lock-arm64-release.apk
          if-no-files-found: error

      - name: Read previous APK build metadata
        id: previous_apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PREVIOUS_SHA=""
          if gh release view latest-apk --json body --jq '.body' >/tmp/latest_apk_body.txt 2>/dev/null; then
            PREVIOUS_SHA="$(grep -Eo '[0-9a-f]{40}' /tmp/latest_apk_body.txt | head -n 1 || true)"
          fi
          echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish latest ARM64 APK download
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          APK="dist/my-lock-arm64-release.apk"
          TAG="latest-apk"
          NAME="MY LOCK Latest ARM64 APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$NAME" --notes "Latest MY LOCK Android ARM64 release APK.\nCommit: $COMMIT_SHA"
          else
            gh release create "$TAG" "$APK" --title "$NAME" --notes "Latest MY LOCK Android ARM64 release APK.\nCommit: $COMMIT_SHA"
          fi

      - name: Build APK change summary
        id: change_summary
        env:
          PREVIOUS_SHA: ${{ steps.previous_apk.outputs.previous_sha }}
        run: |
          set -e
          SUMMARY_FILE=/tmp/my-lock-change-summary.txt
          : > "$SUMMARY_FILE"

          if [ -n "$PREVIOUS_SHA" ] && git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
            git log --no-merges --pretty='- %s' "$PREVIOUS_SHA..${GITHUB_SHA}" > "$SUMMARY_FILE"
          fi

          if [ ! -s "$SUMMARY_FILE" ]; then
            git log --no-merges -n 5 --pretty='- %s' "${GITHUB_SHA}" > "$SUMMARY_FILE"
          fi

          echo "summary_file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Email Supabase ARM64 APK with change summary
        if: ${{ success() }}
        env:
          SMTP_USERNAME: ${{ secrets.APK_MAIL_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.APK_MAIL_APP_PASSWORD }}
          RECIPIENT: rlatkd5959@gmail.com
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APK_URL: https://dddpxudwfsydrhfgvvyn.supabase.co/storage/v1/object/public/my-lock-apk/my-lock-arm64-release.apk?v=${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CHANGE_SUMMARY_FILE: ${{ steps.change_summary.outputs.summary_file }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          from datetime import datetime, timezone, timedelta
          from email.message import EmailMessage

          username = os.environ.get("SMTP_USERNAME", "")
          password = os.environ.get("SMTP_APP_PASSWORD", "")
          if not username or not password:
              raise SystemExit("APK mail secrets are not configured")

          commit_sha = os.environ["COMMIT_SHA"]
          build_time = os.environ.get("BUILD_TIME", "")
          apk_url = os.environ["APK_URL"]
          run_url = os.environ["RUN_URL"]
          commit_message = os.environ.get("COMMIT_MESSAGE", "").strip() or "변경 내역 없음"
          change_summary_file = os.environ.get("CHANGE_SUMMARY_FILE", "")
          try:
              with open(change_summary_file, "r", encoding="utf-8") as f:
                  change_summary = f.read().strip()
          except Exception:
              change_summary = ""
          if not change_summary:
              change_summary = f"- {commit_message.splitlines()[0]}"
          try:
              dt = datetime.fromisoformat(build_time.replace("Z", "+00:00"))
              display_time = dt.astimezone(timezone(timedelta(hours=9))).strftime("%Y-%m-%d %H:%M KST")
          except Exception:
              display_time = build_time or "unknown"

          msg = EmailMessage()
          msg["From"] = username
          msg["To"] = os.environ["RECIPIENT"]
          msg["Subject"] = f"MY LOCK ARM64 Release APK | {display_time} | {commit_sha[:8]}"
          msg.set_content(
              "MY LOCK Android ARM64 Release APK 빌드와 다운로드 검증이 완료되었습니다.\n\n"
              f"빌드 시각: {display_time}\n"
              f"커밋: {commit_sha}\n\n"
              "이번 변경사항\n"
              "----------------\n"
              f"{change_summary}\n\n"
              f"ARM64 Release APK: {apk_url}\n"
              f"빌드 상세: {run_url}\n\n"
              "위 APK 주소는 Supabase Storage의 최신 ARM64 Release 파일로 유지됩니다."
          )

          summary_html = "<br>".join(
              line.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              for line in change_summary.splitlines()
          )
          msg.add_alternative(f"""
          <html>
            <body style="font-family:Arial,sans-serif;line-height:1.55;color:#222">
              <h2 style="margin-bottom:4px">MY LOCK 테스트 빌드 완료</h2>
              <div style="color:#666;margin-bottom:18px">{display_time} · ARM64 · Release</div>
              <h3>이번 변경사항</h3>
              <div style="margin-bottom:22px">{summary_html}</div>

              <p>
                <a href="{apk_url}" style="display:inline-block;padding:12px 18px;background:#111;color:#fff;text-decoration:none;border-radius:8px">
                  ARM64 APK 다운로드
                </a>
              </p>

              <p style="color:#666;font-size:13px">
                위 버튼은 Supabase Storage의 최신 ARM64 Release APK로 연결됩니다.<br>
                <a href="{run_url}">빌드 상세</a>
              </p>
              <p style="color:#999;font-size:12px">commit {commit_sha}</p>
            </body>
          </html>
          """, subtype="html")

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(username, password)
              smtp.send_message(msg)
          PY

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'ios' || github.event.inputs.target == 'all') }}
    name: iOS analyze, test, compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap iOS
        env:
          PLATFORMS: ios
        run: bash tool/bootstrap.sh

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Compile iOS without signing
        run: flutter build ios --debug --no-codesign

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-ios-debug-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
