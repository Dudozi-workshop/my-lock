name: MY LOCK Integrated Labs

on:
  push:
    branches:
      - feat/style-lab-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylock-integrated-labs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: my-lock-shape-lab-pages
      PRIMARY_URL: https://my-lock-shape-lab-pages.pages.dev/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate ShapeSpec masks
        run: python3 tool/validate_shape_masks.py

      - name: Validate Sea Turtle master
        run: python3 tool/validate_sea_turtle_master.py

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build integrated Labs
        run: bash tool/build_shape_lab.sh

      - name: Write release identity
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          meta = json.loads(Path('shape_lab/release_metadata_20261003_r03.json').read_text())
          meta['source_commit'] = os.environ['GITHUB_SHA']
          Path('build/shape_lab/version.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2))
          PYCODE

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-integrated-labs
          path: build/shape_lab
          if-no-files-found: error
          retention-days: 14

      - name: Set Pages production branch to integration
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          curl --fail --show-error --silent             --request PATCH             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --header "Content-Type: application/json"             --data '{"production_branch":"feat/style-lab-integration"}'             "$API"             --output /tmp/pages-project-update.json

      - name: Deploy integrated Labs
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          npx wrangler pages deploy build/shape_lab             --project-name "$PAGES_PROJECT"             --branch "feat/style-lab-integration"             --commit-hash "$GITHUB_SHA"

      - name: Verify public Labs
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          curl --fail --show-error --silent --location             --retry 5 --retry-delay 3 --retry-all-errors             --output /tmp/pages-index.html             "$PRIMARY_URL"
          grep -q "<html" /tmp/pages-index.html
          grep -q "flutter_bootstrap.js" /tmp/pages-index.html

      - name: Verify R2 release identity
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request
          sha = os.environ['GITHUB_SHA']
          for attempt in range(12):
              url = os.environ['PRIMARY_URL'].rstrip('/') + '/version.json?sha=' + sha + '&attempt=' + str(attempt)
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  release = json.load(urllib.request.urlopen(request, timeout=20))
                  if release.get('source_commit') == sha and release.get('version') == 'LABS-2026.10.03-R03':
                      print('Canonical R2 release verified:', sha)
                      break
                  print('Canonical release propagation pending:', release.get('source_commit'))
              except Exception as error:
                  print('Canonical release retry:', type(error).__name__)
              time.sleep(5)
          else:
              raise AssertionError('Canonical release identity did not converge to the deployed commit')
          PYCODE

      - name: Publish access summary
        if: always()
        run: |
          {
            echo "## MY LOCK Integrated Labs"
            echo ""
            echo "- Public: $PRIMARY_URL"
            echo "- Soft Basic: $PRIMARY_URL?lab=style&style=soft-basic"
            echo "- Crayon Soft: $PRIMARY_URL?lab=style&style=crayon-soft"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
