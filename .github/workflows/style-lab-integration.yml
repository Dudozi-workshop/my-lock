name: MY LOCK Integrated Labs

on:
  push:
    branches:
      - feat/style-lab-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylock-integrated-labs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: my-lock-shape-lab-pages
      PRIMARY_URL: https://my-lock-shape-lab-pages.pages.dev/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate Background assets
        run: python3 tool/validate_background_assets.py

      - name: Validate ShapeSpec masks
        run: python3 tool/validate_shape_masks.py

      - name: Validate Sea Turtle master
        run: python3 tool/validate_sea_turtle_master.py

      - name: Verify A texture shader and preserved R21
        run: flutter test test/painted_sunbeam_test.dart test/broad_sunbeam_test.dart

      - name: Test Starfish micro idle
        run: flutter test test/starfish_micro_idle_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build integrated Labs
        run: bash tool/build_shape_lab.sh

      - name: Write release identity
        run: |
          python3 - <<'PYCODE'
          import json, os, html
          from pathlib import Path
          meta = json.loads(Path('shape_lab/release_metadata_20261005_r25.json').read_text())
          meta['source_commit'] = os.environ['GITHUB_SHA']
          Path('build/shape_lab/labs-release.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2))
          page = Path('build/shape_lab/index.html')
          tags = ''.join('<meta name="mylock-' + key + '" content="' + html.escape(str(meta[key]), quote=True) + '">' for key in ['version', 'source_commit', 'purpose', 'scope', 'source_branch', 'status'])
          page.write_text(page.read_text().replace('</head>', tags + '\n</head>'))
          PYCODE

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-integrated-labs
          path: build/shape_lab
          if-no-files-found: error
          retention-days: 14

      - name: Set Pages production branch to integration
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/style-lab-integration' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          curl --fail --show-error --silent             --request PATCH             --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             --header "Content-Type: application/json"             --data '{"production_branch":"feat/style-lab-integration"}'             "$API"             --output /tmp/pages-project-update.json

      - name: Deploy integrated Labs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/style-lab-integration' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          npx wrangler pages deploy build/shape_lab             --project-name "$PAGES_PROJECT"             --branch "feat/style-lab-integration"             --commit-hash "$GITHUB_SHA"

      - name: Verify public Labs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/style-lab-integration' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          curl --fail --show-error --silent --location             --retry 5 --retry-delay 3 --retry-all-errors             --output /tmp/pages-index.html             "$PRIMARY_URL"
          grep -q "<html" /tmp/pages-index.html
          grep -q "flutter_bootstrap.js" /tmp/pages-index.html
          ASSET_URL="${PRIMARY_URL}assets/assets/backgrounds/drop01/shallow_clear_base_v1.webp"
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --retry-all-errors --output /tmp/shallow_clear_base_v1.webp "$ASSET_URL"
          test "$(wc -c < /tmp/shallow_clear_base_v1.webp | tr -d ' ')" = "27242"
          echo "e04aa1a84cbac0d6635fed2d67b703c81ebb9353d3894e7a6e9af18e7a05c599  /tmp/shallow_clear_base_v1.webp" | sha256sum -c -

      - name: Verify approved Base Only v2 public binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/style-lab-integration' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --retry-all-errors --output /tmp/base-only-v2.png "${PRIMARY_URL}assets/assets/backgrounds/drop01/shallow_clear_base_only_v2_approved_candidate.png"
          test "$(wc -c < /tmp/base-only-v2.png | tr -d ' ')" = "1547439"
          echo "0bbc263d61b3a524b9c027e1894fab3209085d631c7a2c313d261a17ecf98ff2  /tmp/base-only-v2.png" | sha256sum -c -

      - name: Verify A texture study public binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/style-lab-integration' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --retry-all-errors --output /tmp/light-texture-r22.png "${PRIMARY_URL}assets/assets/backgrounds/drop01/volumetric_a_texture_study_r22.png"
          test "$(wc -c < /tmp/light-texture-r22.png | tr -d ' ')" = "20248"
          echo "52b3bb4029a345642f8212c698914f4dd0a8089c5a1ab02a0d75dcbb50ff9d61  /tmp/light-texture-r22.png" | sha256sum -c -

      - name: Verify Starfish runtime public binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/style-lab-integration' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --retry-all-errors --output /tmp/starfish-runtime.webp "${PRIMARY_URL}assets/assets/raster_shapes/starfish_runtime_master_final_v1_256.webp"
          echo "b3a35bba9d238afba67d2e17b8649129a75f905f7c52048dc82ba09d105f9e60  /tmp/starfish-runtime.webp" | sha256sum -c -

      - name: Verify R25 release identity
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/style-lab-integration' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          python3 - <<'PYCODE'
          import os, time, subprocess
          sha = os.environ['GITHUB_SHA']
          expected = '<meta name="mylock-source_commit" content="' + sha + '">'
          for attempt in range(12):
              url = os.environ['PRIMARY_URL'] + '?release=' + sha + '&attempt=' + str(attempt)
              try:
                  page = subprocess.check_output(['curl', '--fail', '--silent', '--show-error', '--location', '--max-time', '20', url], text=True)
                  if expected in page and 'LABS-2026.10.05-R25' in page:
                      print('Canonical R25 release verified:', sha)
                      break
                  print('Canonical HTML release propagation pending', flush=True)
              except Exception as error:
                  print('Canonical release retry:', type(error).__name__, flush=True)
              time.sleep(5)
          else:
              raise AssertionError('Canonical HTML release identity did not converge')
          PYCODE

      - name: Publish access summary
        if: always()
        run: |
          {
            echo "## MY LOCK Integrated Labs"
            echo ""
            echo "- Public: $PRIMARY_URL"
            echo "- Soft Basic: $PRIMARY_URL?lab=style&style=soft-basic"
            echo "- Crayon Soft: $PRIMARY_URL?lab=style&style=crayon-soft"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
