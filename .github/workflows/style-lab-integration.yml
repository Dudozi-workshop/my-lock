name: MY LOCK Integrated Labs

on:
  push:
    branches:
      - feat/style-lab-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylock-integrated-labs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: my-lock-shape-lab-pages
      PRIMARY_URL: https://my-lock-shape-lab-pages.pages.dev/

    steps:
      - uses: actions/checkout@v4

      - name: Validate two-site governance
        run: python3 tool/validate_site_governance.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate ShapeSpec masks
        run: python3 tool/validate_shape_masks.py

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build production Web for PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 tool/mylock_asset_system.py validate-all assets/shape_masters
          bash tool/build_web.sh

      - name: Build integrated Labs
        if: ${{ github.event_name != 'pull_request' }}
        run: bash tool/build_shape_lab.sh

      - name: Upload recovery artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-integrated-labs
          path: build/shape_lab
          if-no-files-found: error
          retention-days: 14

      - name: Set Pages production branch to integration
        if: ${{ github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          curl --fail --show-error --silent --request PATCH --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" --data '{"production_branch":"feat/style-lab-integration"}' "$API" --output /tmp/pages-project-update.json

      - name: Deploy integrated Labs
        if: ${{ github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          npx wrangler pages deploy build/shape_lab --project-name "$PAGES_PROJECT" --branch "feat/style-lab-integration" --commit-hash "$(git rev-parse HEAD)"

      - name: Verify public Labs
        if: ${{ github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --retry-all-errors --output /tmp/pages-index.html "$PRIMARY_URL"
          grep -q "<html" /tmp/pages-index.html
          grep -q "flutter_bootstrap.js" /tmp/pages-index.html

      - name: Publish access summary
        if: always()
        run: |
          {
            echo "## MY LOCK Integrated Labs"
            echo ""
            echo "- Public: $PRIMARY_URL"
            echo "- Site metadata: config/site_registry.json"
            echo "- Commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
