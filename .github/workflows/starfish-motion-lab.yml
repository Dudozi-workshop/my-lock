name: MY LOCK Starfish Motion Candidate QA

on:
  push:
    branches:
      - feat/starfish-micro-idle-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylock-starfish-motion-candidate
  cancel-in-progress: true

jobs:
  candidate-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Bootstrap Web
        env:
          PLATFORMS: web
        run: bash tool/bootstrap.sh
      - name: Analyze
        run: flutter analyze
      - name: Test Starfish micro idle
        run: flutter test test/starfish_micro_idle_test.dart
      - name: Build Starfish Motion Candidate artifact
        run: flutter build web --release --target starfish_lab/main.dart --base-href "/"
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: starfish-micro-idle-candidate
          path: build/web
          if-no-files-found: error
          retention-days: 14
