name: Crayon Runtime Sync QA
on:
  push:
    branches: [fix/crayon-runtime-sync]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Bootstrap
        run: PLATFORMS=android,web bash tool/bootstrap.sh
      - name: Validate, analyze and test
        run: |
          python3 tool/validate_shape_masks.py
          dart format lib/lock_engine/shape_spec/shape_spec.dart lib/lock_engine/shape_spec/shape_spec_renderer.dart test/crayon_runtime_sync_test.dart
          flutter analyze
          flutter test
      - name: Web build
        run: bash tool/build_web.sh
      - name: Android build
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: crayon-runtime-sync-candidate
          path: |
            build/web
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
