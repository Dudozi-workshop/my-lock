name: Runtime v3 Candidate QA
on:
  push:
    branches: [runtime/sea-turtle-v3]
permissions:
  contents: read
concurrency:
  group: runtime-v3-candidate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Bootstrap Android and web
        run: PLATFORMS=android,web bash tool/bootstrap.sh
      - name: Validate, analyze and test
        run: |
          python3 tool/validate_shape_masks.py
          flutter analyze
          flutter test
      - name: Build production web
        run: bash tool/build_web.sh
      - name: Build Android including lockMain
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sea-turtle-runtime-v3-candidate
          path: |
            build/web
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
