name: MY LOCK Visual Renderer v2

on:
  push:
    branches:
      - feat/visual-renderer-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-lock-visual-renderer-v2
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Bootstrap Android
        env:
          PLATFORMS: android
        run: bash tool/bootstrap.sh

      - name: Analyze
        run: flutter analyze

      - name: Export exact previews
        run: flutter test preview_test/shape_preview_golden_test.dart --update-goldens

      - name: Upload exact-render previews
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-visual-renderer-v2-previews
          path: preview_test/goldens
          retention-days: 14

      - name: Build ARM64 APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/my-lock-visual-renderer-v2-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-visual-renderer-v2-arm64
          path: dist/my-lock-visual-renderer-v2-arm64.apk
          retention-days: 14
