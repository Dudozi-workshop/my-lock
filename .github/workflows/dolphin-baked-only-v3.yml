name: MY LOCK Dolphin Baked Only v3

on:
  push:
    branches:
      - feat/dolphin-baked-only-v3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-lock-dolphin-baked-only-v3
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate baked-only dolphin color assets
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 tool/generate_dolphin_baked_only_v3.py

      - name: Bootstrap Android
        env:
          PLATFORMS: android
        run: bash tool/bootstrap.sh

      - name: Analyze
        run: flutter analyze

      - name: Build ARM64 APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/my-lock-dolphin-baked-only-v3-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-dolphin-baked-only-v3-arm64
          path: dist/my-lock-dolphin-baked-only-v3-arm64.apk
          retention-days: 14

  publish-release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: my-lock-dolphin-baked-only-v3-arm64
          path: dist

      - name: Publish direct-download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dolphin-baked-only-v3-latest"
          APK="dist/my-lock-dolphin-baked-only-v3-arm64.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "MY LOCK Dolphin Baked Only v3" \
              --notes "Baked-only dolphin renderer. Seven color variants share one silhouette; legacy dolphin vector/mask/sprite runtime fallbacks are disabled." \
              --prerelease
          fi
