name: MY LOCK Crayon Shape Lab

on:
  push:
    branches:
      - feat/crayon-style-lab
    paths:
      - 'lib/lock_engine/shape_spec/**'
      - 'lib/lock_engine/shape_painter.dart'
      - 'assets/shape_specs/**'
      - 'shape_lab/**'
      - 'tool/build_shape_lab.sh'
      - 'tool/validate_shape_masks.py'
      - 'pubspec.yaml'
      - '.github/workflows/shape-lab.yml'
      - 'wrangler.shape-lab.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylock-crayon-shape-lab
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate ShapeSpec masks
        run: python3 tool/validate_shape_masks.py

      - name: Test ShapeSpec
        run: flutter test test/shape_spec_test.dart

      - name: Build Shape Lab
        run: bash tool/build_shape_lab.sh

      - name: Upload Shape Lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-crayon-shape-lab
          path: build/shape_lab
          if-no-files-found: error
          retention-days: 14

      - name: Deploy Shape Lab
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.shape-lab.jsonc

      - name: Verify public Shape Lab URL
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          URL="https://my-lock-shape-lab.rlatkd5959.workers.dev/"
          echo "Checking $URL"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output /tmp/shape-lab-index.html \
            --write-out "HTTP %{http_code}\n" \
            "$URL"
          grep -q "<html" /tmp/shape-lab-index.html
          grep -q "flutter_bootstrap.js" /tmp/shape-lab-index.html


      - name: Create Pages fallback project if needed
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          PAGES_PROJECT: my-lock-shape-lab-pages
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          if curl --fail --show-error --silent \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/$PAGES_PROJECT" \
            --output /tmp/pages-project.json; then
            echo "Pages project already exists"
          else
            curl --fail --show-error --silent \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"$PAGES_PROJECT\",\"production_branch\":\"feat/crayon-style-lab\"}" \
              "$API" \
              --output /tmp/pages-project-create.json
            echo "Pages project created"
          fi

      - name: Deploy Pages fallback
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          PAGES_PROJECT: my-lock-shape-lab-pages
        run: |
          set -e
          npx wrangler pages deploy build/shape_lab \
            --project-name "$PAGES_PROJECT" \
            --branch "feat/crayon-style-lab" \
            --commit-hash "$GITHUB_SHA"

      - name: Verify Pages fallback URL
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          PAGES_PROJECT: my-lock-shape-lab-pages
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          curl --fail --show-error --silent \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API" \
            --output /tmp/pages-project-final.json
          SUBDOMAIN="$(jq -r '.result.subdomain' /tmp/pages-project-final.json)"
          test -n "$SUBDOMAIN"
          test "$SUBDOMAIN" != "null"
          URL="https://$SUBDOMAIN/"
          echo "Checking $URL"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output /tmp/pages-index.html \
            --write-out "HTTP %{http_code}\n" \
            "$URL"
          grep -q "<html" /tmp/pages-index.html
          grep -q "flutter_bootstrap.js" /tmp/pages-index.html
          echo "PAGES_URL=$URL"
