name: MY LOCK Shared Shape Lab

on:
  push:
    branches:
      - feat/lab-runtime-workbench
      - feat/style-lab-integration
    paths:
      - 'lib/lock_engine/shape_spec/**'
      - 'lib/lock_engine/shape_painter.dart'
      - 'lib/lock_engine/models.dart'
      - 'lib/lock_engine/floating_preview.dart'
      - 'lib/lock_engine/raster_palette_clock.dart'
      - 'lib/lock_engine/raster_shape_bootstrap.dart'
      - 'lib/lock_engine/swim_pose_runtime.dart'
      - 'assets/shape_specs/**'
      - 'assets/lab/**'
      - 'assets/raster_shapes/**'
      - 'lib/features/customize/shape_style/widgets/shape_choice_card.dart'
      - 'test/lab_workbench_test.dart'
      - 'test/shape_spec_test.dart'
      - 'test/raster_runtime_v3_test.dart'
      - 'test/swim_pose_runtime_test.dart'
      - 'shape_lab/**'
      - 'tool/build_shape_lab.sh'
      - 'tool/validate_shape_masks.py'
      - 'pubspec.yaml'
      - '.github/workflows/shape-lab.yml'
      - 'wrangler.shape-lab.jsonc'
      - 'docs/shape-lab-preview-standard.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylock-crayon-shape-lab
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: my-lock-shape-lab-pages
      PRIMARY_URL: https://my-lock-shape-lab-pages.pages.dev/
      BACKUP_URL: https://my-lock-shape-lab.rlatkd5959.workers.dev/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Validate ShapeSpec masks
        run: python3 tool/validate_shape_masks.py

      - name: Test ShapeSpec
        run: flutter test --dart-define=CANDY_SOFT_CANDIDATE=true test/shape_spec_test.dart test/lab_workbench_test.dart test/raster_runtime_v3_test.dart test/swim_pose_runtime_test.dart

      - name: Build Shape Lab
        run: bash tool/build_shape_lab.sh

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-crayon-shape-lab
          path: build/shape_lab
          if-no-files-found: error
          retention-days: 14

      # Primary host: Cloudflare Pages.
      # A Worker DNS issue must never block the primary preview.
      - name: Read existing Pages production branch
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          curl --fail --show-error --silent \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            --output /tmp/pages-project.json
          python3 - <<'PYCODE' >> "$GITHUB_ENV"
          import json
          data = json.load(open('/tmp/pages-project.json'))
          branch = data['result']['production_branch']
          assert isinstance(branch, str) and branch and '\n' not in branch
          print('PAGES_PRODUCTION_BRANCH=' + branch)
          PYCODE

      - name: Deploy Pages primary
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          npx wrangler pages deploy build/shape_lab             --project-name "$PAGES_PROJECT"             --branch "$PAGES_PRODUCTION_BRANCH"             --commit-hash "$GITHUB_SHA"

      - name: Verify Pages primary
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          echo "Checking $PRIMARY_URL"
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output /tmp/pages-index.html \
            --write-out "HTTP %{http_code}\n" \
            "$PRIMARY_URL"
          grep -q "<html" /tmp/pages-index.html
          grep -q "flutter_bootstrap.js" /tmp/pages-index.html

          # Cloudflare Pages can report deployment complete a few seconds
          # before the stable project URL starts serving the new production
          # revision. Poll the immutable version stamp instead of accepting
          # a stale HTTP 200.
          for attempt in $(seq 1 30); do
            curl --fail --show-error --silent --location \
              "$PRIMARY_URL/version.json?commit=$GITHUB_SHA&attempt=$attempt" \
              --output /tmp/lab-version.json || true
            if python3 - <<'PYCODE'
          import json, os, sys
          try:
              data = json.load(open('/tmp/lab-version.json'))
          except Exception:
              sys.exit(1)
          sys.exit(0 if data.get('commit') == os.environ['GITHUB_SHA'] else 1)
          PYCODE
            then
              echo "Stable Lab revision verified on attempt $attempt"
              exit 0
            fi
            echo "Stable Lab still propagating ($attempt/30)"
            sleep 2
          done

          echo "Stable Lab did not publish commit $GITHUB_SHA in time"
          cat /tmp/lab-version.json || true
          exit 1

      # Backup host: Worker. Keep it available, but do not fail the job if
      # workers.dev is temporarily unreachable for a network or DNS reason.
      - name: Deploy Worker backup
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.shape-lab.jsonc

      - name: Verify Worker backup
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        continue-on-error: true
        run: |
          set -e
          echo "Checking $BACKUP_URL"
          curl --fail --show-error --silent --location             --retry 3 --retry-delay 3 --retry-all-errors             --output /tmp/worker-index.html             --write-out "HTTP %{http_code}\n"             "$BACKUP_URL"
          grep -q "<html" /tmp/worker-index.html
          grep -q "flutter_bootstrap.js" /tmp/worker-index.html

      - name: Publish preview access summary
        if: always()
        run: |
          {
            echo "## MY LOCK Shape Lab preview"
            echo ""
            echo "- Primary: $PRIMARY_URL"
            echo "- Backup: $BACKUP_URL"
            echo "- Recovery artifact: my-lock-crayon-shape-lab (14 days)"
            echo "- Commit: $GITHUB_SHA"
            echo ""
            echo "Access order: Pages -> Worker -> GitHub Actions artifact"
          } >> "$GITHUB_STEP_SUMMARY"
