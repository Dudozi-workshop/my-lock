name: MY LOCK Shape Lab

on:
  push:
    branches:
      - feat/shape-lab
    paths:
      - 'lib/lock_engine/**'
      - 'assets/materials/**'
      - 'shape_lab/**'
      - 'preview_test/**'
      - 'tool/build_shape_lab.sh'
      - 'pubspec.yaml'
      - '.github/workflows/shape-lab.yml'
      - 'wrangler.shape-lab.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mylock-shape-lab
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Export exact 58px Flutter previews
        run: flutter test preview_test/shape_preview_golden_test.dart --update-goldens

      - name: Upload exact-render PNG previews
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-shape-previews
          path: preview_test/goldens
          if-no-files-found: error
          retention-days: 14

      - name: Build Shape Lab
        run: bash tool/build_shape_lab.sh

      - name: Upload Shape Lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-lock-shape-lab
          path: build/shape_lab
          if-no-files-found: error
          retention-days: 14

      - name: Deploy Shape Lab
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.shape-lab.jsonc
