<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07110f" />
  <title>MY LOCK · Asset Book</title>
  <style>
    :root {
      --bg:#07110f;
      --bg-2:#0b1715;
      --panel:rgba(17,31,28,.78);
      --panel-2:rgba(12,24,22,.9);
      --line:rgba(184,232,217,.12);
      --line-strong:rgba(184,232,217,.24);
      --text:#eff8f5;
      --muted:#91aaa2;
      --soft:#c1d7d0;
      --mint:#87e7c7;
      --aqua:#78cfe0;
      --amber:#efc77b;
      --danger:#ff9c9c;
      --shadow:0 30px 80px rgba(0,0,0,.34);
      --radius:28px;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; background:var(--bg); }
    body {
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 8%, rgba(74,162,139,.15), transparent 30rem),
        radial-gradient(circle at 84% 18%, rgba(83,140,156,.13), transparent 34rem),
        linear-gradient(180deg,#07110f 0%,#081412 55%,#050d0c 100%);
      font-family:Inter, Pretendard, "Noto Sans KR", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing:-.02em;
    }
    a { color:inherit; }
    button { font:inherit; }
    .grain {
      position:fixed; inset:0; pointer-events:none; opacity:.18; mix-blend-mode:soft-light;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
    }
    .shell { width:min(1500px,calc(100% - 32px)); margin:0 auto; padding:24px 0 90px; }
    .topbar {
      position:sticky; top:12px; z-index:30;
      display:flex; align-items:center; justify-content:space-between; gap:18px;
      margin-bottom:18px; padding:12px 14px 12px 18px;
      border:1px solid var(--line); border-radius:18px;
      background:rgba(7,17,15,.72); backdrop-filter:blur(22px);
      box-shadow:0 12px 40px rgba(0,0,0,.18);
    }
    .brand { display:flex; align-items:center; gap:11px; font-weight:800; letter-spacing:.04em; font-size:13px; }
    .brand-mark {
      width:30px; height:30px; display:grid; place-items:center; border-radius:10px;
      border:1px solid rgba(135,231,199,.35);
      background:linear-gradient(145deg,rgba(135,231,199,.22),rgba(120,207,224,.08));
      box-shadow:inset 0 0 18px rgba(135,231,199,.08);
    }
    .brand-mark::before {
      content:""; width:9px; height:10px; border:1.8px solid var(--mint); border-radius:3px;
      box-shadow:0 -5px 0 -2px var(--bg),0 -6px 0 -1px var(--mint);
    }
    .nav { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
    .nav a {
      text-decoration:none; color:var(--muted); font-size:12px; padding:8px 10px;
      border-radius:10px; transition:.18s ease;
    }
    .nav a:hover { color:var(--text); background:rgba(255,255,255,.05); }

    .hero {
      position:relative; overflow:hidden;
      min-height:520px; display:grid; grid-template-columns:1.1fr .9fr; gap:26px;
      padding:48px; border:1px solid var(--line); border-radius:36px;
      background:
        radial-gradient(circle at 76% 46%,rgba(117,226,191,.08),transparent 18rem),
        linear-gradient(140deg,rgba(18,35,31,.94),rgba(8,18,16,.86));
      box-shadow:var(--shadow);
    }
    .hero::before {
      content:""; position:absolute; inset:-1px; pointer-events:none; opacity:.32;
      background-image:
        linear-gradient(rgba(167,217,202,.06) 1px,transparent 1px),
        linear-gradient(90deg,rgba(167,217,202,.06) 1px,transparent 1px);
      background-size:52px 52px;
      mask-image:linear-gradient(90deg,rgba(0,0,0,.55),transparent 70%);
    }
    .hero-copy { position:relative; z-index:2; align-self:end; max-width:760px; }
    .eyebrow { color:var(--mint); font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:14px 0 0; font-size:clamp(54px,7vw,112px); line-height:.86; letter-spacing:-.075em; font-weight:860; }
    .hero-sub {
      display:flex; flex-wrap:wrap; gap:9px; margin-top:24px;
      color:var(--muted); font-size:13px;
    }
    .pill {
      display:inline-flex; align-items:center; gap:7px; min-height:30px; padding:0 11px;
      border:1px solid var(--line); border-radius:999px;
      background:rgba(255,255,255,.025);
      color:var(--soft);
    }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 14px rgba(135,231,199,.7); }
    .dot.warn { background:var(--amber); box-shadow:0 0 14px rgba(239,199,123,.55); }

    .master-stage {
      position:relative; z-index:2; align-self:stretch;
      display:flex; flex-direction:column; justify-content:space-between;
      min-height:410px; padding:24px;
      border-radius:26px; border:1px solid var(--line);
      background:
        radial-gradient(circle at 50% 48%,rgba(135,231,199,.10),transparent 13rem),
        rgba(5,14,12,.56);
    }
    .master-stage::before,.master-stage::after {
      content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      border:1px solid rgba(135,231,199,.1); border-radius:50%;
    }
    .master-stage::before { width:220px; height:220px; }
    .master-stage::after { width:330px; height:330px; }
    .master-label { display:flex; justify-content:space-between; gap:14px; position:relative; z-index:2; }
    .master-label span:first-child { font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); }
    .status { font-size:11px; color:var(--mint); }
    .master-glyph {
      position:relative; z-index:2; align-self:center; width:min(86%,390px); aspect-ratio:1;
      display:grid; place-items:center; border-radius:50%;
      color:rgba(219,242,234,.78); text-align:center;
    }
    .master-glyph img {
      width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 22px 34px rgba(0,0,0,.35));
    }
    .master-glyph strong { display:block; font-size:44px; letter-spacing:-.06em; }
    .master-glyph small { display:block; margin-top:10px; max-width:220px; color:var(--muted); line-height:1.55; font-size:12px; }
    .master-meta { position:relative; z-index:2; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .mini {
      padding:12px; border-radius:15px; background:rgba(255,255,255,.025); border:1px solid var(--line);
    }
    .mini b { display:block; font-size:12px; }
    .mini span { display:block; margin-top:5px; font-size:11px; color:var(--muted); }

    .section { padding-top:72px; scroll-margin-top:84px; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .kicker { color:var(--mint); font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
    h2 { margin:8px 0 0; font-size:clamp(30px,4vw,52px); letter-spacing:-.055em; }
    .section-note { max-width:530px; color:var(--muted); font-size:13px; line-height:1.7; text-align:right; }


    .theme-hero {
      position:relative; overflow:hidden; min-height:560px;
      display:grid; grid-template-columns:1.15fr .85fr; gap:24px;
      padding:54px; border:1px solid var(--line); border-radius:38px;
      background:
        radial-gradient(circle at 75% 20%,rgba(124,207,196,.18),transparent 26rem),
        radial-gradient(circle at 88% 82%,rgba(185,167,232,.13),transparent 26rem),
        linear-gradient(145deg,rgba(12,32,29,.97),rgba(7,18,17,.94));
      box-shadow:var(--shadow);
    }
    .theme-hero::before {
      content:""; position:absolute; inset:0; opacity:.28; pointer-events:none;
      background:
        radial-gradient(circle at 20% 70%,rgba(255,255,255,.08) 0 1px,transparent 2px),
        radial-gradient(circle at 42% 18%,rgba(255,255,255,.06) 0 1px,transparent 2px);
      background-size:72px 72px,96px 96px;
    }
    .theme-copy { position:relative; z-index:2; align-self:center; }
    .theme-copy h1 { font-size:clamp(52px,7vw,108px); line-height:.9; }
    .theme-copy p { max-width:680px; margin:22px 0 0; color:var(--soft); font-size:16px; line-height:1.8; }
    .theme-principles { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
    .theme-board {
      position:relative; z-index:2; align-self:stretch; display:grid; align-content:center; gap:12px;
      padding:24px; border:1px solid var(--line); border-radius:28px;
      background:rgba(5,16,14,.56);
    }
    .theme-board h3 { margin:0 0 4px; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .palette-strip { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
    .palette-swatch {
      min-height:110px; border-radius:16px; overflow:hidden; position:relative;
      border:1px solid rgba(255,255,255,.08);
    }
    .palette-swatch span {
      position:absolute; inset:auto 0 0; padding:32px 8px 9px;
      background:linear-gradient(transparent,rgba(0,0,0,.48));
      font-size:9px; font-weight:800; text-align:center;
    }
    .signature-swatch {
      min-height:74px; border-radius:16px; border:1px solid rgba(255,255,255,.1);
      display:flex; align-items:end; padding:12px; font-size:12px; font-weight:800;
    }
    .theme-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }
    .theme-card {
      grid-column:span 4; padding:22px; min-height:230px; border:1px solid var(--line); border-radius:24px;
      background:linear-gradient(155deg,rgba(18,33,30,.82),rgba(10,20,18,.78));
    }
    .theme-card h3 { margin:18px 0 6px; font-size:24px; letter-spacing:-.04em; }
    .theme-card p { margin:0; color:var(--muted); font-size:12px; line-height:1.65; }
    .tier {
      display:inline-flex; padding:6px 8px; border-radius:999px; border:1px solid var(--line);
      color:var(--soft); font-size:9px; text-transform:uppercase; letter-spacing:.1em;
    }
    .roster { display:grid; gap:8px; }
    .roster-row {
      display:grid; grid-template-columns:1.2fr .8fr 1.4fr; gap:12px; align-items:center;
      padding:14px 16px; border:1px solid var(--line); border-radius:15px; background:rgba(255,255,255,.018);
    }
    .roster-row b { font-size:12px; }
    .roster-row span { color:var(--muted); font-size:11px; }
    .roster-row em { font-style:normal; color:var(--mint); font-size:10px; text-align:right; }
    .scene-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .scene-card {
      min-height:260px; padding:22px; border:1px solid var(--line); border-radius:24px;
      background:
        radial-gradient(circle at 80% 10%,rgba(120,207,224,.09),transparent 13rem),
        rgba(12,25,23,.76);
    }
    .scene-card small { color:var(--mint); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
    .scene-card h3 { margin:18px 0 8px; font-size:25px; letter-spacing:-.04em; }
    .scene-card p { color:var(--muted); font-size:12px; line-height:1.7; }
    .signature-moment { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); color:var(--soft); font-size:11px; line-height:1.6; }
    .feature-pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .feature-card {
      padding:26px; border:1px solid var(--line); border-radius:26px; background:rgba(12,25,22,.74);
    }
    .feature-card h3 { margin:10px 0 10px; font-size:30px; letter-spacing:-.045em; }
    .feature-card p { color:var(--muted); font-size:13px; line-height:1.75; margin:0; }
    .feature-list { display:grid; gap:7px; margin-top:18px; }
    .feature-list div { padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.025); font-size:11px; color:var(--soft); }
    .shape-divider { margin-top:82px; padding-top:28px; border-top:1px solid var(--line); }
    .shape-divider .kicker { color:var(--aqua); }

    .part-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }
    .part-card {
      grid-column:span 4; min-height:330px; position:relative; overflow:hidden;
      padding:22px; border:1px solid var(--line); border-radius:24px;
      background:linear-gradient(155deg,rgba(18,33,30,.88),rgba(10,20,18,.84));
      transition:transform .2s ease,border-color .2s ease,background .2s ease;
    }
    .part-card:nth-child(1), .part-card:nth-child(2) { grid-column:span 6; }
    .part-card:hover { transform:translateY(-3px); border-color:var(--line-strong); background:linear-gradient(155deg,rgba(21,39,35,.94),rgba(10,20,18,.9)); }
    .part-index { color:rgba(199,226,217,.25); font-size:11px; letter-spacing:.14em; }
    .part-preview {
      height:132px; margin:18px -2px 6px; display:grid; place-items:center;
      border-radius:18px; border:1px solid rgba(184,232,217,.08);
      background:
        radial-gradient(circle at 50% 50%,rgba(135,231,199,.075),transparent 62%),
        rgba(255,255,255,.012);
      overflow:hidden;
    }
    .part-preview img {
      width:92%; height:92%; object-fit:contain; filter:drop-shadow(0 14px 20px rgba(0,0,0,.32));
    }
    .part-preview.placeholder { color:var(--muted); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
    .part-card h3 { margin:18px 0 5px; font-size:28px; letter-spacing:-.045em; }
    .part-role { color:var(--muted); font-size:12px; min-height:34px; line-height:1.45; }
    .part-version { margin-top:24px; font:700 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--soft); }
    .part-state { margin-top:8px; display:flex; align-items:center; gap:7px; font-size:11px; color:var(--mint); }
    .layers { display:flex; flex-wrap:wrap; gap:6px; margin-top:22px; }
    .layer {
      padding:6px 8px; border-radius:9px; border:1px solid var(--line); color:#b8ccc6; font-size:10px;
      background:rgba(255,255,255,.02);
    }
    .empty { color:var(--muted); }
    .lock-ring {
      position:absolute; width:160px; height:160px; border-radius:50%; right:-56px; top:-58px;
      border:1px solid rgba(135,231,199,.08); box-shadow:0 0 0 26px rgba(135,231,199,.018),0 0 0 54px rgba(135,231,199,.01);
    }

    .pipeline {
      border:1px solid var(--line); border-radius:26px; background:rgba(13,25,22,.66); padding:22px;
      overflow:hidden;
    }
    .steps { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; min-width:860px; }
    .step {
      position:relative; padding:18px 12px; min-height:104px; border:1px solid var(--line); border-radius:16px;
      background:rgba(255,255,255,.02);
    }
    .step:not(:last-child)::after {
      content:""; position:absolute; right:-9px; top:50%; width:9px; border-top:1px solid rgba(135,231,199,.24);
    }
    .step b { display:block; font-size:11px; color:var(--soft); }
    .step span { display:block; margin-top:8px; font-size:10px; color:var(--muted); line-height:1.5; }
    .pipeline-scroll { overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; }

    .manifest-layout { display:grid; grid-template-columns:330px 1fr; gap:16px; }
    .manifest-nav, .manifest-panel {
      border:1px solid var(--line); border-radius:24px; background:rgba(12,24,21,.72);
    }
    .manifest-nav { padding:12px; align-self:start; position:sticky; top:88px; }
    .manifest-tab {
      width:100%; border:0; color:var(--muted); background:transparent; text-align:left;
      padding:13px 14px; border-radius:12px; cursor:pointer; transition:.16s ease;
    }
    .manifest-tab:hover { background:rgba(255,255,255,.035); color:var(--text); }
    .manifest-tab.active { background:rgba(135,231,199,.1); color:var(--text); }
    .manifest-tab b { display:block; font-size:12px; }
    .manifest-tab span { display:block; margin-top:4px; font-size:10px; opacity:.7; }
    .manifest-panel { padding:24px; min-height:400px; }
    .manifest-title { display:flex; align-items:start; justify-content:space-between; gap:16px; }
    .manifest-title h3 { margin:0; font-size:30px; letter-spacing:-.04em; }
    .manifest-title code { color:var(--muted); font-size:10px; text-align:right; word-break:break-all; max-width:54%; }
    .record-list { display:grid; gap:10px; margin-top:24px; }
    details {
      border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.018); overflow:hidden;
    }
    summary { cursor:pointer; list-style:none; padding:14px 16px; display:flex; justify-content:space-between; gap:14px; }
    summary::-webkit-details-marker { display:none; }
    .summary-left b { font-size:12px; }
    .summary-left span { display:block; margin-top:4px; color:var(--muted); font-size:10px; }
    .summary-state { color:var(--mint); font-size:10px; white-space:nowrap; }
    .record-body { border-top:1px solid var(--line); padding:15px 16px; }
    .record-meta { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .record-meta div { padding:11px; border-radius:12px; background:rgba(255,255,255,.02); }
    .record-meta span { display:block; font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
    .record-meta b { display:block; margin-top:5px; font-size:11px; word-break:break-word; }
    .qa-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:8px; }
    .qa {
      padding:10px; border:1px solid rgba(135,231,199,.09); border-radius:12px;
      background:rgba(135,231,199,.025);
    }
    .qa span { display:block; color:var(--muted); font-size:9px; }
    .qa b { display:block; margin-top:5px; color:var(--mint); font-size:11px; }

    .sync-card {
      display:grid; grid-template-columns:1fr 1fr; gap:0;
      border:1px solid var(--line); border-radius:28px; overflow:hidden;
      background:linear-gradient(135deg,rgba(17,34,30,.9),rgba(8,17,15,.9));
    }
    .sync-copy { padding:34px; }
    .sync-copy h3 { font-size:30px; margin:10px 0 10px; letter-spacing:-.045em; }
    .sync-copy p { color:var(--muted); font-size:13px; line-height:1.75; margin:0; }
    .sync-flow { padding:28px; border-left:1px solid var(--line); display:grid; gap:9px; }
    .flow-item {
      display:flex; align-items:center; gap:12px; padding:13px 14px;
      border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.02);
      font-size:12px;
    }
    .flow-num {
      flex:0 0 auto; width:24px; height:24px; display:grid; place-items:center;
      border-radius:8px; color:var(--mint); background:rgba(135,231,199,.08); font-size:10px;
    }
    .footer {
      display:flex; justify-content:space-between; gap:20px; margin-top:70px; padding-top:20px;
      border-top:1px solid var(--line); color:var(--muted); font-size:10px; line-height:1.6;
    }
    .error {
      margin:60px auto; max-width:720px; padding:30px; border:1px solid rgba(255,156,156,.24);
      border-radius:22px; background:rgba(120,25,25,.08); color:#ffd6d6;
    }

    @media (max-width:1040px) {
      .theme-hero { grid-template-columns:1fr; min-height:auto; padding:34px; }
      .scene-grid { grid-template-columns:1fr 1fr; }
      .theme-card { grid-column:span 6; }
      .hero { grid-template-columns:1fr; min-height:auto; padding:34px; }
      .master-stage { min-height:360px; }
      .part-card,.part-card:nth-child(1),.part-card:nth-child(2) { grid-column:span 6; }
      .manifest-layout { grid-template-columns:1fr; }
      .manifest-nav { position:static; display:flex; overflow:auto; }
      .manifest-tab { min-width:190px; }
      .sync-card { grid-template-columns:1fr; }
      .sync-flow { border-left:0; border-top:1px solid var(--line); }
    }
    @media (max-width:720px) {
      .shell { width:min(100% - 20px,1500px); padding-top:10px; }
      .topbar { top:7px; padding:10px 12px; border-radius:16px; }
      .nav a:nth-child(n+3) { display:none; }
      .theme-hero { padding:24px; border-radius:26px; }
      .theme-copy h1 { font-size:52px; }
      .palette-strip { grid-template-columns:repeat(3,1fr); }
      .palette-swatch { min-height:82px; }
      .theme-card { grid-column:1 / -1; }
      .scene-grid,.feature-pair { grid-template-columns:1fr; }
      .roster-row { grid-template-columns:1fr; }
      .roster-row em { text-align:left; }
      .hero { padding:24px; border-radius:26px; }
      h1 { font-size:56px; }
      .master-stage { min-height:340px; padding:18px; }
      .master-stage::after { width:260px; height:260px; }
      .master-stage::before { width:180px; height:180px; }
      .master-meta { grid-template-columns:1fr; }
      .section { padding-top:54px; }
      .section-head { align-items:start; flex-direction:column; }
      .section-note { text-align:left; }
      .part-card,.part-card:nth-child(1),.part-card:nth-child(2) { grid-column:1 / -1; min-height:250px; }
      .record-meta { grid-template-columns:1fr 1fr; }
      .qa-grid { grid-template-columns:1fr 1fr; }
      .manifest-title { flex-direction:column; }
      .manifest-title code { max-width:100%; text-align:left; }
      .sync-copy,.sync-flow { padding:22px; }
      .footer { flex-direction:column; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <main class="shell" id="app">
    <div class="error">Asset Book data를 불러오는 중입니다.</div>
  </main>
  <script src="./data.js"></script>
  <script>
  (() => {
    const data = window.MYLOCK_ASSET_BOOK_DATA;
    const root = document.getElementById('app');
    if (!data) {
      root.innerHTML = '<div class="error"><b>Asset Book registry가 없습니다.</b><br><br>Production manifest build step을 확인하세요.</div>';
      return;
    }

    const esc = (v='') => String(v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    const layerLabel = (v) => ({
      geometry:'Geometry', outline:'Outline', pattern_detail:'Pattern / Detail',
      shadow:'Shadow', highlight:'Highlight', base_albedo:'Base / Albedo',
      palette:'Palette', runtime:'Runtime'
    }[v] || v);

    const finalCount = data.stats.final_part_count;
    const totalParts = data.parts.length;
    const masterOk = data.shape.master_pointer_current;

    root.innerHTML = `
      <header class="topbar">
        <div class="brand"><span class="brand-mark"></span><span>MY LOCK · ASSET BOOK</span></div>
        <nav class="nav">
          <a href="#theme">Theme</a>
          <a href="#collection">Collection</a>
          <a href="#shape-overview">Sea Turtle</a>
          <a href="#parts">Parts</a>
          <a href="#manifests">Manifests</a>
        </nav>
      </header>

      <section class="theme-hero" id="theme">
        <div class="theme-copy">
          <div class="eyebrow">${esc(data.theme?.drop || 'Drop 01')} · Theme master</div>
          <h1>${esc(data.theme?.display_name || '작은 바닷속')}</h1>
          <p>${esc(data.theme?.concept || '')}</p>
          <div class="theme-principles">
            ${(data.theme?.production_direction || []).map(x => `<span class="pill">${esc(x)}</span>`).join('')}
          </div>
        </div>
        <div class="theme-board">
          <h3>2D Soft Palette</h3>
          <div class="palette-strip">
            ${(data.theme?.palette?.colors || []).map(x => `
              <div class="palette-swatch" style="background:${esc(x.hex)}">
                <span>${esc(x.ko)}</span>
              </div>`).join('')}
          </div>
          ${data.theme?.palette?.signature ? `
            <div class="signature-swatch" style="background:linear-gradient(90deg,${data.theme.palette.signature.gradient.map(esc).join(',')})">
              ${esc(data.theme.palette.signature.ko)} · Signature
            </div>` : ''}
          <div class="mini"><b>${esc(data.theme?.palette?.status || '')}</b><span>Theme-level palette direction</span></div>
        </div>
      </section>

      <section class="section" id="collection">
        <div class="section-head">
          <div>
            <div class="kicker">01 · Theme plan</div>
            <h2>Shape Pack · first plan</h2>
          </div>
          <div class="section-note">초기 6종 Theme Pack 기획은 보존하고, 현재 실제 Production 진행상황은 별도 roster로 표시합니다.</div>
        </div>
        <div class="theme-grid">
          ${(data.theme?.initial_shape_pack?.shapes || []).map((s,i) => `
            <article class="theme-card">
              <span class="tier">${esc(s.tier)}</span>
              <div class="part-index" style="margin-top:18px">${String(i+1).padStart(2,'0')} · ${esc(s.en)}</div>
              <h3>${esc(s.name)}</h3>
              <p>${esc(s.role)}</p>
              ${s.selection ? `<div class="part-version">${esc(s.selection)}</div>` : ''}
            </article>`).join('')}
        </div>
      </section>

      <section class="section" id="roster">
        <div class="section-head">
          <div>
            <div class="kicker">02 · Production roster</div>
            <h2>Plan and production</h2>
          </div>
          <div class="section-note">Theme Plan을 폐기하지 않고, 실제 제작이 어디까지 왔는지만 분리해 보여줍니다.</div>
        </div>
        <div class="roster">
          ${(data.theme?.production_roster || []).map(r => `
            <div class="roster-row">
              <b>${esc(r.name)} <span>· ${esc(r.en)}</span></b>
              <span>${esc(r.selection || '—')}</span>
              <em>${esc(r.status)}</em>
            </div>`).join('')}
        </div>
      </section>

      <section class="section" id="backgrounds">
        <div class="section-head">
          <div>
            <div class="kicker">03 · Background</div>
            <h2>Three ocean scenes</h2>
          </div>
          <div class="section-note">단순 색상 변형이 아니라 서로 다른 공간 경험으로 확정된 3종 Background 기획입니다.</div>
        </div>
        <div class="scene-grid">
          ${(data.theme?.backgrounds || []).map(bg => `
            <article class="scene-card">
              <small>0${esc(bg.order)} · ${esc(bg.en)}</small>
              <h3>${esc(bg.name)}</h3>
              <p>${esc(bg.concept)}</p>
              <div class="signature-moment"><b>Signature Moment</b><br>${esc(bg.signature_moment)}</div>
            </article>`).join('')}
        </div>
      </section>

      <section class="section" id="theme-system">
        <div class="feature-pair">
          <article class="feature-card">
            <div class="kicker">04 · Motion</div>
            <h3>${esc(data.theme?.motion?.name || '유영')}</h3>
            <p>${esc(data.theme?.motion?.signature_moment || '')}</p>
            <div class="feature-list">
              ${(data.theme?.motion?.rules || []).map(x => `<div>${esc(x)}</div>`).join('')}
            </div>
          </article>
          <article class="feature-card">
            <div class="kicker">05 · Collection complete</div>
            <h3>Theme Reward</h3>
            <p>${esc(data.theme?.collection_reward?.unlock || '')} · ${esc(data.theme?.collection_reward?.sale || '')}</p>
            <div class="feature-list">
              ${(data.theme?.collection_reward?.items || []).map(x => `<div><b>${esc(x.name)}</b> · ${esc(x.type)}<br><span style="color:var(--muted)">${esc(x.rule)}</span></div>`).join('')}
            </div>
          </article>
        </div>
      </section>

      <div class="shape-divider">
        <div class="kicker">06 · Active Production Shape</div>
      </div>

      <section class="hero" id="shape-overview">
        <div class="hero-copy">
          <div class="eyebrow">Sea Turtle v3 · Production archive</div>
          <h1>SEA<br>TURTLE <span style="color:var(--mint)">v3</span></h1>
          <div class="hero-sub">
            <span class="pill"><i class="dot"></i>${esc(data.shape.selection)}</span>
            <span class="pill">${esc(data.shape.canvas)}</span>
            <span class="pill">${finalCount} / ${totalParts} normalized primary parts</span>
          </div>
        </div>

        <div class="master-stage">
          <div class="master-label">
            <span>Authoritative Master</span>
            <span class="status">${masterOk ? '● CURRENT' : '● POINTER CHECK'}</span>
          </div>
          <div class="master-glyph">
            ${data.shape.master_preview
              ? `<img src="${esc(data.shape.master_preview)}" alt="Sea Turtle v3 authoritative master preview" />`
              : `<div><strong>Q3</strong><small>현재 Production Master 계보와 Preview 버전이 일치할 때만 이미지가 표시됩니다.</small></div>`}
          </div>
          <div class="master-meta">
            <div class="mini"><b>${esc(data.shape.authoritative_master)}</b><span>Active master lineage</span></div>
            <div class="mini"><b>${esc(data.shape.canonical_filename || 'Canonical source')}</b><span>Canonical filename pointer</span></div>
          </div>
        </div>
      </section>

      <section class="section" id="parts">
        <div class="section-head">
          <div>
            <div class="kicker">07 · Parts</div>
            <h2>Production parts</h2>
          </div>
          <div class="section-note">현재 Final / Locked 계보만 카드에 승격됩니다. Candidate·Superseded·Legacy는 자동 제외됩니다.</div>
        </div>
        <div class="part-grid">
          ${data.parts.map((p,i) => `
            <article class="part-card">
              <span class="lock-ring"></span>
              <div class="part-index">${String(i+1).padStart(2,'0')} / ${String(totalParts).padStart(2,'0')}</div>
              ${p.preview
                ? `<div class="part-preview"><img src="${esc(p.preview)}" alt="${esc(p.label)} final preview" /></div>`
                : `<div class="part-preview placeholder">${p.primary ? 'Preview refresh required' : 'Locked · preview not normalized'}</div>`}
              <h3>${esc(p.label)}</h3>
              <div class="part-role">${esc(p.role)}</div>
              <div class="part-version">${esc(p.version)}</div>
              <div class="part-state">
                <i class="dot ${p.primary ? '' : 'warn'}"></i>
                ${esc(p.state)}
              </div>
              <div class="layers">
                ${p.layers.length
                  ? p.layers.map(l => `<span class="layer">${esc(layerLabel(l))}</span>`).join('')
                  : '<span class="layer empty">Active material manifest not normalized</span>'}
              </div>
            </article>
          `).join('')}
        </div>
      </section>

      <section class="section" id="production">
        <div class="section-head">
          <div>
            <div class="kicker">08 · Production system</div>
            <h2>How it is built</h2>
          </div>
          <div class="section-note">MY LOCK의 Canonical Production Asset Rule을 그대로 시각화합니다. Viewer가 Gate를 새로 만들거나 건너뛰지 않습니다.</div>
        </div>
        <div class="pipeline">
          <div class="pipeline-scroll">
            <div class="steps">
              ${[
                ['01','Source','Authoritative source 확인'],
                ['02','Ownership','사용자 승인 Overlay'],
                ['03','Mask','승인 Ownership의 exact Mask'],
                ['04','Asset','기존 source pixel 추출'],
                ['05','Remainder','Removed Remainder 생성'],
                ['06','Recompose','Residual / seam QA'],
                ['07','Approve','사용자 최종 승인'],
                ['08','LOCK','Final / Locked 등록']
              ].map(x => `<div class="step"><b>${x[0]} · ${x[1]}</b><span>${x[2]}</span></div>`).join('')}
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="manifests">
        <div class="section-head">
          <div>
            <div class="kicker">09 · Active manifests</div>
            <h2>Current build state</h2>
          </div>
          <div class="section-note">${data.stats.active_manifest_count}개의 Final / Locked manifest를 현재 빌드에서 감지했습니다. QA 값은 manifest에 존재하는 항목만 표시합니다.</div>
        </div>

        <div class="manifest-layout">
          <aside class="manifest-nav">
            ${data.parts.map((p,i) => `
              <button class="manifest-tab ${i===0?'active':''}" data-part="${esc(p.id)}">
                <b>${esc(p.label)}</b>
                <span>${esc(p.state)} · ${p.active_manifests.length} manifests</span>
              </button>
            `).join('')}
          </aside>
          <div class="manifest-panel" id="manifest-panel"></div>
        </div>
      </section>

      <section class="section" id="sync">
        <div class="sync-card">
          <div class="sync-copy">
            <div class="kicker">10 · Auto sync</div>
            <h3>Final이 바뀌면, 다음 빌드가 따라갑니다.</h3>
            <p>Asset Book은 별도의 원본 DB가 아닙니다. GitHub Production manifest를 빌드 시 다시 스캔하고 Final / Locked 상태만 Registry로 생성합니다. Candidate가 생겨도 화면은 바뀌지 않습니다. Final 버전이 바뀌면 상태·버전·QA는 다음 빌드에서 자동 갱신되고, 기존 Preview는 버전 가드가 불일치하는 즉시 숨겨져 오래된 픽셀이 현재본처럼 보이지 않습니다.</p>
          </div>
          <div class="sync-flow">
            <div class="flow-item"><span class="flow-num">1</span>Production asset 승인</div>
            <div class="flow-item"><span class="flow-num">2</span>Final / Locked manifest 갱신</div>
            <div class="flow-item"><span class="flow-num">3</span>Asset Book registry 자동 생성</div>
            <div class="flow-item"><span class="flow-num">4</span>Cloudflare Web Preview 재배포</div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span>MY LOCK · Asset Book / Drop 01 · 작은 바닷속</span>
        <span>Viewer only · Source of Truth: Production Master + Manifest · Private Drive identifiers are not published</span>
      </footer>
    `;

    const panel = document.getElementById('manifest-panel');
    const tabs = [...document.querySelectorAll('.manifest-tab')];

    function renderPart(id) {
      const p = data.parts.find(x => x.id === id);
      if (!p) return;
      panel.innerHTML = `
        <div class="manifest-title">
          <div><div class="kicker">Part detail</div><h3>${esc(p.label)}</h3></div>
          <code>${p.primary ? esc(p.primary.manifest) : 'No normalized active manifest'}</code>
        </div>
        <div class="record-list">
          ${p.active_manifests.length ? p.active_manifests.map((r,idx) => `
            <details ${idx===0?'open':''}>
              <summary>
                <div class="summary-left"><b>${esc(layerLabel(r.layer))} · ${esc(r.version)}</b><span>${esc(r.manifest)}</span></div>
                <span class="summary-state">${esc(r.status)}</span>
              </summary>
              <div class="record-body">
                <div class="record-meta">
                  <div><span>Version</span><b>${esc(r.version)}</b></div>
                  <div><span>Layer</span><b>${esc(layerLabel(r.layer))}</b></div>
                  <div><span>Approved</span><b>${esc(r.approval || '—')}</b></div>
                  <div><span>Canvas</span><b>${esc(r.canvas || data.shape.canvas)}</b></div>
                </div>
                ${r.qa && r.qa.length ? `<div class="qa-grid">${r.qa.map(q => `<div class="qa"><span>${esc(q.label)}</span><b>${esc(q.value)}</b></div>`).join('')}</div>` : ''}
              </div>
            </details>
          `).join('') : '<div class="mini"><b>Locked reference detected</b><span>이 Part는 다른 Active Production manifest에서 잠금 대상으로 확인되지만, 독립된 Active manifest 형식이 아직 정규화되지 않았습니다.</span></div>'}
        </div>
      `;
    }

    tabs.forEach(tab => tab.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      tab.classList.add('active');
      renderPart(tab.dataset.part);
    }));

    renderPart(data.parts[0]?.id);
  })();
  </script>
</body>
</html>
