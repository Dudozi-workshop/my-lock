<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07110f" />
  <title>MY LOCK · Asset Book</title>
  <style>
    :root{
      --bg:#07110f;--panel:#0d1b18;--panel2:#11231f;--line:rgba(190,233,219,.12);
      --line2:rgba(190,233,219,.23);--text:#eff8f5;--muted:#8fa9a0;--soft:#c6d9d3;
      --mint:#87e7c7;--aqua:#78cfe0;--amber:#efc77b;--shadow:0 28px 80px rgba(0,0,0,.34);
    }
    *{box-sizing:border-box} html{background:var(--bg);scroll-behavior:smooth}
    body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;letter-spacing:-.02em;
      background:
        radial-gradient(circle at 10% 4%,rgba(74,162,139,.13),transparent 28rem),
        radial-gradient(circle at 88% 8%,rgba(82,140,161,.11),transparent 32rem),
        linear-gradient(180deg,#07110f,#081412 58%,#050d0c)}
    button,a{font:inherit} button{color:inherit}.shell{width:min(1480px,calc(100% - 30px));margin:auto;padding:18px 0 80px}
    .top{position:sticky;top:8px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px 14px 11px 16px;
      border:1px solid var(--line);border-radius:18px;background:rgba(7,17,15,.78);backdrop-filter:blur(20px);box-shadow:0 12px 36px rgba(0,0,0,.18)}
    .brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:850;letter-spacing:.08em;white-space:nowrap}
    .mark{width:29px;height:29px;border-radius:10px;border:1px solid rgba(135,231,199,.32);display:grid;place-items:center;background:rgba(135,231,199,.07)}
    .mark:before{content:"";width:9px;height:9px;border:1.7px solid var(--mint);border-radius:3px;box-shadow:0 -5px 0 -2px var(--bg),0 -6px 0 -1px var(--mint)}
    .tabs{display:flex;gap:4px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
    .tab{border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:11px;white-space:nowrap;font-size:11px;cursor:pointer}
    .tab:hover{color:var(--text);background:rgba(255,255,255,.035)}.tab.active{color:var(--text);background:rgba(135,231,199,.1)}
    .crumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:18px 3px 0;color:var(--muted);font-size:10px}
    .crumbs button{border:0;background:none;color:var(--muted);padding:0;cursor:pointer}.crumbs button:hover{color:var(--mint)}
    .view{margin-top:14px}.hero{min-height:490px;position:relative;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;gap:24px;padding:48px;border:1px solid var(--line);border-radius:34px;
      background:radial-gradient(circle at 75% 35%,rgba(124,207,196,.16),transparent 23rem),linear-gradient(145deg,rgba(17,37,33,.95),rgba(8,19,17,.93));box-shadow:var(--shadow)}
    .hero:before{content:"";position:absolute;inset:0;opacity:.25;background-image:linear-gradient(rgba(170,218,204,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(170,218,204,.05) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(90deg,#000,transparent 78%)}
    .hero-copy,.hero-side{position:relative;z-index:2}.hero-copy{align-self:end}.eyebrow,.kicker{color:var(--mint);font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:12px 0 0;font-size:clamp(50px,7vw,104px);line-height:.9;letter-spacing:-.065em}h2{margin:8px 0 0;font-size:clamp(29px,4vw,48px);letter-spacing:-.05em}
    h3{letter-spacing:-.035em}.lead{max-width:760px;margin:22px 0 0;color:var(--soft);font-size:15px;line-height:1.8}
    .pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.022);font-size:10px;color:var(--soft)}
    .hero-side{padding:23px;border:1px solid var(--line);border-radius:25px;background:rgba(4,14,12,.5);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
    .hero-side-title{color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
    .overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.02)}
    .mini b{font-size:12px}.mini span{display:block;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.45}
    .section{padding-top:54px}.head{display:flex;align-items:end;justify-content:space-between;gap:22px;margin-bottom:20px}.note{max-width:560px;text-align:right;color:var(--muted);font-size:12px;line-height:1.65}
    .card-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{grid-column:span 4;position:relative;overflow:hidden;min-height:210px;padding:20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(155deg,rgba(18,34,30,.86),rgba(10,20,18,.82));cursor:pointer;transition:.18s}
    .card:hover{transform:translateY(-2px);border-color:var(--line2);background:linear-gradient(155deg,rgba(22,41,36,.92),rgba(10,20,18,.88))}.card.wide{grid-column:span 6}.card.full{grid-column:1/-1}
    .card small{color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.card h3{margin:22px 0 6px;font-size:25px}.card p{margin:0;color:var(--muted);font-size:11px;line-height:1.65}
    .badge{display:inline-flex;margin-top:16px;padding:6px 8px;border-radius:999px;border:1px solid var(--line);font-size:9px;color:var(--mint)}.badge.amber{color:var(--amber)}
    .palette{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.swatch{min-height:125px;border-radius:17px;border:1px solid rgba(255,255,255,.09);position:relative;overflow:hidden;cursor:pointer;transition:.16s}
    .swatch:hover{transform:translateY(-2px)}.swatch span{position:absolute;inset:auto 0 0;padding:34px 8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.5));font-size:9px;font-weight:800;text-align:center}
    .detail-shell{display:grid;grid-template-columns:250px 1fr;gap:14px}.side-nav{align-self:start;position:sticky;top:78px;padding:10px;border:1px solid var(--line);border-radius:20px;background:rgba(10,22,19,.78)}
    .side-nav button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 13px;border-radius:11px;cursor:pointer;font-size:11px}.side-nav button.active{background:rgba(135,231,199,.09);color:var(--text)}
    .panel{min-height:530px;padding:26px;border:1px solid var(--line);border-radius:24px;background:rgba(11,24,21,.72)}.panel-title{display:flex;justify-content:space-between;gap:18px;align-items:start}
    .panel-title h2{margin-top:4px}.panel-title code{max-width:48%;font-size:9px;color:var(--muted);word-break:break-all;text-align:right}
    .master-box{margin-top:22px;display:grid;grid-template-columns:minmax(260px,.75fr) 1.25fr;gap:18px}.preview{min-height:330px;display:grid;place-items:center;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle,rgba(135,231,199,.08),transparent 60%),rgba(255,255,255,.012)}
    .preview img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 18px 28px rgba(0,0,0,.34))}.specs{display:grid;gap:9px}.spec{padding:13px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.018)}
    .spec span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.spec b{display:block;margin-top:5px;font-size:11px;line-height:1.5}
    .part-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:22px}.part{grid-column:span 6;padding:17px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.018)}
    .part-top{display:flex;justify-content:space-between;gap:12px}.part h4{margin:0;font-size:15px}.part .state{font-size:9px;color:var(--mint)}.part p{color:var(--muted);font-size:10px;line-height:1.55}
    .layers{display:flex;flex-wrap:wrap;gap:5px}.layer{padding:5px 7px;border:1px solid var(--line);border-radius:8px;color:var(--soft);font-size:9px}
    .pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:24px}.step{padding:15px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.017)}.step b{font-size:10px}.step span{display:block;margin-top:6px;color:var(--muted);font-size:9px;line-height:1.5}
    details{border:1px solid var(--line);border-radius:14px;margin-top:9px;background:rgba(255,255,255,.015);overflow:hidden}summary{list-style:none;padding:13px 15px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}summary::-webkit-details-marker{display:none}
    summary b{font-size:11px}summary span{font-size:9px;color:var(--mint)}.detail-body{border-top:1px solid var(--line);padding:14px}.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.qa div{padding:9px;border-radius:10px;background:rgba(135,231,199,.025);border:1px solid rgba(135,231,199,.08)}.qa span{display:block;color:var(--muted);font-size:8px}.qa b{display:block;margin-top:4px;font-size:10px;color:var(--mint)}
    .feature-list{display:grid;gap:8px;margin-top:18px}.feature{padding:12px 13px;border:1px solid var(--line);border-radius:13px;color:var(--soft);font-size:11px;background:rgba(255,255,255,.018)}
    .back{border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--soft);padding:8px 10px;border-radius:10px;cursor:pointer;font-size:10px}.back:hover{border-color:var(--line2)}
    .footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:9px}
    @media(max-width:1050px){.hero{grid-template-columns:1fr}.card{grid-column:span 6}.palette{grid-template-columns:repeat(4,1fr)}.detail-shell{grid-template-columns:1fr}.side-nav{position:static;display:flex;overflow:auto}.side-nav button{min-width:140px}.master-box{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:720px){.shell{width:calc(100% - 18px);padding-top:8px}.top{top:5px;flex-direction:column;align-items:stretch}.brand{justify-content:space-between}.tabs{width:100%}.hero{padding:24px;min-height:auto;border-radius:26px}.hero-copy h1{font-size:54px}.overview-grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.note{text-align:left}.card,.card.wide{grid-column:1/-1}.palette{grid-template-columns:repeat(2,1fr)}.panel{padding:18px}.panel-title{flex-direction:column}.panel-title code{max-width:100%;text-align:left}.part{grid-column:1/-1}.pipeline{grid-template-columns:1fr}.qa{grid-template-columns:1fr 1fr}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><span class="mark"></span><span>MY LOCK · ASSET BOOK</span></div>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <div class="crumbs" id="crumbs"></div>
    <section class="view" id="view"></section>
    <footer class="footer"><span>Drop 01 · 작은 바닷속</span><span>Viewer only · Source of Truth remains Production Master + Manifest</span></footer>
  </main>
  <script src="./data.js"></script>
  <script>
  (() => {
    const data = window.MYLOCK_ASSET_BOOK_DATA;
    const view = document.getElementById('view');
    const tabs = document.getElementById('tabs');
    const crumbs = document.getElementById('crumbs');
    if (!data) { view.innerHTML = '<div class="panel">Asset Book registry가 없습니다.</div>'; return; }

    const esc = (v='') => String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9가-힣]+/g,'-').replace(/^-|-$/g,'');
    const theme = data.theme || {};
    const layerLabel = v => ({geometry:'Geometry',outline:'Outline',pattern_detail:'Pattern / Detail',shadow:'Shadow',highlight:'Highlight',base_albedo:'Base / Albedo',palette:'Palette',runtime:'Runtime'}[v]||v);

    const topTabs = [
      ['overview','Overview'],
      ['shapes','Shapes'],
      ['backgrounds','Backgrounds'],
      ['palette','Palette'],
      ['motion','Motion & Effects'],
      ['collection','Collection']
    ];

    const route = () => (location.hash.replace(/^#/,'') || 'overview').split('/').filter(Boolean);
    const go = path => { location.hash = path; };
    window.assetBookGo = go;

    function renderTabs(active){
      tabs.innerHTML = topTabs.map(([id,label]) => '<button class="tab '+(active===id?'active':'')+'" onclick="assetBookGo(\''+id+'\')">'+esc(label)+'</button>').join('');
    }

    function renderCrumbs(items){
      crumbs.innerHTML = items.map((x,i) => {
        const last = i === items.length-1;
        return (i?'<span>/</span>':'') + (last ? '<span>'+esc(x.label)+'</span>' : '<button onclick="assetBookGo(\''+x.path+'\')">'+esc(x.label)+'</button>');
      }).join('');
    }

    function overview(){
      renderCrumbs([{label:theme.drop+' · '+theme.display_name,path:'overview'}]);
      const colors = theme.palette?.colors || [];
      view.innerHTML = `
        <div class="hero">
          <div class="hero-copy">
            <div class="eyebrow">${esc(theme.drop)} · Theme Overview</div>
            <h1>${esc(theme.display_name)}</h1>
            <p class="lead">${esc(theme.concept)}</p>
            <div class="pills">${(theme.production_direction||[]).map(x=>'<span class="pill">'+esc(x)+'</span>').join('')}</div>
          </div>
          <div class="hero-side">
            <div class="hero-side-title">Theme composition</div>
            <div class="overview-grid">
              <div class="mini"><b>Shapes</b><span>초기 6종 Theme Pack + 현재 Production Shape</span></div>
              <div class="mini"><b>Palette</b><span>6색 + Signature Aurora Sea</span></div>
              <div class="mini"><b>Backgrounds</b><span>3종 기획 확정</span></div>
              <div class="mini"><b>Motion</b><span>${esc(theme.motion?.name || '유영')} · Theme 대표 Motion</span></div>
              <div class="mini"><b>Effects</b><span>수면광 Accent + Bubble Trail</span></div>
              <div class="mini"><b>Production</b><span>2D 감성형 · Palette 자동 파생 · Baked Runtime</span></div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="head"><div><div class="kicker">Theme language</div><h2>Visual direction</h2></div><div class="note">테마 전체에 공통 적용되는 초기 기획과 표현 원칙만 보여줍니다.</div></div>
          <div class="card-grid">
            ${(theme.visual_rules||[]).map((x,i)=>`<div class="card"><small>Rule 0${i+1}</small><h3>${esc(x.split('·')[0])}</h3><p>${esc(x)}</p></div>`).join('')}
          </div>
        </div>

        <div class="section">
          <div class="head"><div><div class="kicker">Theme palette</div><h2>Color identity</h2></div><button class="back" onclick="assetBookGo('palette')">Palette 전체 보기 →</button></div>
          <div class="palette">
            ${colors.map(c=>`<div class="swatch" style="background:${esc(c.hex)}" onclick="assetBookGo('palette/${esc(c.id)}')"><span>${esc(c.ko)}</span></div>`).join('')}
            ${theme.palette?.signature ? `<div class="swatch" style="background:linear-gradient(135deg,${theme.palette.signature.gradient.map(esc).join(',')})" onclick="assetBookGo('palette/${esc(theme.palette.signature.id)}')"><span>${esc(theme.palette.signature.ko)}</span></div>` : ''}
          </div>
        </div>

        <div class="section">
          <div class="head"><div><div class="kicker">Theme motion</div><h2>${esc(theme.motion?.name || '유영')}</h2></div><button class="back" onclick="assetBookGo('motion/swim')">Motion 상세 →</button></div>
          <div class="card-grid">
            <div class="card wide" onclick="assetBookGo('motion/swim')"><small>Motion</small><h3>${esc(theme.motion?.name || '')}</h3><p>${esc(theme.motion?.signature_moment || '')}</p><span class="badge">${esc(theme.motion?.status || '')}</span></div>
            <div class="card wide" onclick="assetBookGo('collection')"><small>Collection complete</small><h3>수면광 + Bubble Trail</h3><p>Shape 컬렉션 완성 시 해금되는 테마 전용 비매품 표현.</p><span class="badge">${esc(theme.collection_reward?.status || '')}</span></div>
          </div>
        </div>
      `;
    }

    function shapes(){
      renderCrumbs([{label:theme.drop+' · '+theme.display_name,path:'overview'},{label:'Shapes',path:'shapes'}]);
      const roster = theme.production_roster || [];
      view.innerHTML = `
        <div class="head"><div><div class="kicker">Shapes</div><h2>Shape library</h2></div><div class="note">각 Shape를 선택하면 해당 Shape의 Master·선정안·Production 상세로 한 단계 더 들어갑니다.</div></div>
        <div class="card-grid">
          ${roster.map((s,i)=>{
            const id = s.en==='Sea Turtle'?'sea-turtle':slug(s.en);
            return `<article class="card ${s.en==='Sea Turtle'?'wide':''}" onclick="assetBookGo('shape/${id}')">
              <small>${String(i+1).padStart(2,'0')} · ${esc(s.role)}</small>
              <h3>${esc(s.name)} <span style="color:var(--muted);font-size:14px">· ${esc(s.en)}</span></h3>
              <p>${esc(s.selection || 'Master/Production 상세는 후속 제작 단계에서 누적')}</p>
              <span class="badge ${s.status.includes('후속')?'amber':''}">${esc(s.status)}</span>
            </article>`;
          }).join('')}
        </div>
      `;
    }

    function shapeDetail(id, sub='overview'){
      const isTurtle = id==='sea-turtle';
      const roster = theme.production_roster || [];
      const item = isTurtle ? roster.find(x=>x.en==='Sea Turtle') : roster.find(x=>slug(x.en)===id);
      if (!item){ go('shapes'); return; }
      renderCrumbs([{label:theme.drop+' · '+theme.display_name,path:'overview'},{label:'Shapes',path:'shapes'},{label:item.name,path:'shape/'+id},{label:sub,path:'shape/'+id+'/'+sub}]);

      const menu = isTurtle ? [['overview','Overview'],['parts','Parts'],['production','Production'],['manifests','Manifests']] : [['overview','Overview']];
      const menuHtml = menu.map(([k,l])=>'<button class="'+(sub===k?'active':'')+'" onclick="assetBookGo(\'shape/'+id+'/'+k+'\')">'+l+'</button>').join('');

      if(!isTurtle){
        view.innerHTML = `<div class="detail-shell"><aside class="side-nav">${menuHtml}</aside><div class="panel">
          <div class="panel-title"><div><div class="kicker">Shape</div><h2>${esc(item.name)} · ${esc(item.en)}</h2></div><button class="back" onclick="assetBookGo('shapes')">← Shapes</button></div>
          <div class="master-box"><div class="preview"><div style="text-align:center;color:var(--muted)"><b style="display:block;color:var(--soft);font-size:24px">${esc(item.en)}</b><span style="font-size:11px">Preview / production detail pending</span></div></div>
          <div class="specs"><div class="spec"><span>Status</span><b>${esc(item.status)}</b></div><div class="spec"><span>Selection</span><b>${esc(item.selection||'—')}</b></div><div class="spec"><span>Theme role</span><b>${esc(item.role)}</b></div></div></div>
        </div></div>`;
        return;
      }

      let body = '';
      if(sub==='overview'){
        body = `<div class="panel-title"><div><div class="kicker">Active Production Shape</div><h2>Sea Turtle v3</h2></div><button class="back" onclick="assetBookGo('shapes')">← Shapes</button></div>
        <div class="master-box">
          <div class="preview">${data.shape.master_preview?'<img src="'+esc(data.shape.master_preview)+'" alt="Sea Turtle master preview">':'<span>Preview unavailable</span>'}</div>
          <div class="specs">
            <div class="spec"><span>Selection</span><b>${esc(data.shape.selection)}</b></div>
            <div class="spec"><span>Authoritative Master</span><b>${esc(data.shape.authoritative_master)}</b></div>
            <div class="spec"><span>Canvas</span><b>${esc(data.shape.canvas)}</b></div>
            <div class="spec"><span>Status</span><b>${esc(item.status)}</b></div>
            <div class="spec"><span>Character</span><b>큰 등껍질 · 작은 머리 · 길고 유려한 앞지느러미 · 느긋한 유영 인상</b></div>
          </div>
        </div>`;
      } else if(sub==='parts'){
        body = `<div class="panel-title"><div><div class="kicker">Sea Turtle v3</div><h2>Parts</h2></div><code>${esc(data.shape.authoritative_master)}</code></div>
        <div class="part-grid">${data.parts.map(p=>`<article class="part"><div class="part-top"><h4>${esc(p.label)}</h4><span class="state">${esc(p.state)}</span></div>
          <p>${esc(p.role)} · ${esc(p.version)}</p>
          <div class="layers">${p.layers.length?p.layers.map(l=>'<span class="layer">'+esc(layerLabel(l))+'</span>').join(''):'<span class="layer">Manifest normalization pending</span>'}</div>
        </article>`).join('')}</div>`;
      } else if(sub==='production'){
        const steps=[['01','Source','Authoritative source 확인'],['02','Ownership','Ownership Overlay 승인'],['03','Mask','Exact Mask'],['04','Asset','Source pixel extraction'],['05','Remainder','Removed Remainder'],['06','Recompose','Residual / seam QA'],['07','Approve','사용자 승인'],['08','LOCK','Final / Locked']];
        body = `<div class="panel-title"><div><div class="kicker">Sea Turtle v3</div><h2>Production system</h2></div><code>Canonical Production Asset Rule</code></div>
        <div class="pipeline">${steps.map(x=>'<div class="step"><b>'+x[0]+' · '+x[1]+'</b><span>'+x[2]+'</span></div>').join('')}</div>
        <div class="feature-list"><div class="feature">Viewer는 Production Gate를 새로 만들거나 건너뛰지 않음.</div><div class="feature">Production 원본·Mask·Geometry·Material은 Asset Book에서 수정하지 않음.</div><div class="feature">Final / Locked manifest만 현재본으로 승격.</div></div>`;
      } else {
        body = `<div class="panel-title"><div><div class="kicker">Sea Turtle v3</div><h2>Active manifests</h2></div><code>${data.stats.active_manifest_count} detected</code></div>
        ${data.parts.map(p=>`<details><summary><b>${esc(p.label)} · ${esc(p.version)}</b><span>${esc(p.state)}</span></summary><div class="detail-body">
          ${p.active_manifests.length?p.active_manifests.map(r=>`<details><summary><b>${esc(layerLabel(r.layer))} · ${esc(r.version)}</b><span>${esc(r.status)}</span></summary><div class="detail-body">
            <div class="qa">${(r.qa||[]).map(q=>'<div><span>'+esc(q.label)+'</span><b>'+esc(q.value)+'</b></div>').join('')||'<div><span>QA</span><b>Manifest registered</b></div>'}</div>
          </div></details>`).join(''):'<div class="feature">독립 Active manifest 정규화 대기</div>'}
        </div></details>`).join('')}`;
      }
      view.innerHTML = '<div class="detail-shell"><aside class="side-nav">'+menuHtml+'</aside><div class="panel">'+body+'</div></div>';
    }

    function backgrounds(detailId){
      if(detailId){
        const bg=(theme.backgrounds||[]).find(x=>slug(x.en)===detailId || String(x.order)===detailId);
        if(!bg){go('backgrounds');return;}
        renderCrumbs([{label:theme.drop+' · '+theme.display_name,path:'overview'},{label:'Backgrounds',path:'backgrounds'},{label:bg.name,path:'background/'+detailId}]);
        view.innerHTML=`<div class="panel"><div class="panel-title"><div><div class="kicker">Background</div><h2>${esc(bg.name)}</h2></div><button class="back" onclick="assetBookGo('backgrounds')">← Backgrounds</button></div>
          <div class="master-box"><div class="preview"><div style="text-align:center"><div class="kicker">${esc(bg.en)}</div><h2 style="margin-top:10px">${esc(bg.name)}</h2></div></div>
          <div class="specs"><div class="spec"><span>Status</span><b>${esc(bg.status)}</b></div><div class="spec"><span>Concept</span><b>${esc(bg.concept)}</b></div><div class="spec"><span>Signature moment</span><b>${esc(bg.signature_moment)}</b></div></div></div></div>`;
        return;
      }
      renderCrumbs([{label:theme.drop+' · '+theme.display_name,path:'overview'},{label:'Backgrounds',path:'backgrounds'}]);
      view.innerHTML=`<div class="head"><div><div class="kicker">Backgrounds</div><h2>Ocean scenes</h2></div><div class="note">각 배경을 누르면 해당 배경의 기획과 이후 Master/Runtime 기록으로 들어갑니다.</div></div>
      <div class="card-grid">${(theme.backgrounds||[]).map(bg=>`<article class="card" onclick="assetBookGo('background/${slug(bg.en)}')"><small>0${bg.order} · ${esc(bg.en)}</small><h3>${esc(bg.name)}</h3><p>${esc(bg.concept)}</p><span class="badge">${esc(bg.status)}</span></article>`).join('')}</div>`;
    }

    function palette(detailId){
      const colors=[...(theme.palette?.colors||[])];
      if(theme.palette?.signature) colors.push(theme.palette.signature);
      if(detailId){
        const c=colors.find(x=>x.id===detailId); if(!c){go('palette');return;}
        renderCrumbs([{label:theme.drop+' · '+theme.display_name,path:'overview'},{label:'Palette',path:'palette'},{label:c.ko,path:'palette/'+detailId}]);
        const bg=c.gradient?'linear-gradient(135deg,'+c.gradient.map(esc).join(',')+')':esc(c.hex);
        view.innerHTML=`<div class="panel"><div class="panel-title"><div><div class="kicker">Palette color</div><h2>${esc(c.ko)} · ${esc(c.name)}</h2></div><button class="back" onclick="assetBookGo('palette')">← Palette</button></div>
        <div class="master-box"><div class="preview" style="background:${bg}"></div><div class="specs">
          <div class="spec"><span>Color source</span><b>${c.gradient?c.gradient.join(' → '):esc(c.hex)}</b></div>
          <div class="spec"><span>Role</span><b>${esc(c.role || c.note || 'Theme premium color')}</b></div>
          <div class="spec"><span>Rule</span><b>${esc(c.rule || 'Base Color + same-hue 약한 Shade + 작은 Soft Highlight')}</b></div>
          <div class="spec"><span>Status</span><b>${esc(theme.palette?.status || '')}</b></div>
        </div></div></div>`; return;
      }
      renderCrumbs([{label:theme.drop+' · '+theme.display_name,path:'overview'},{label:'Palette',path:'palette'}]);
      view.innerHTML=`<div class="head"><div><div class="kicker">Palette</div><h2>2D Soft color system</h2></div><div class="note">${esc(theme.palette?.status||'')}</div></div>
      <div class="palette">${colors.map(c=>`<div class="swatch" style="background:${c.gradient?'linear-gradient(135deg,'+c.gradient.map(esc).join(',')+')':esc(c.hex)}" onclick="assetBookGo('palette/${esc(c.id)}')"><span>${esc(c.ko)}</span></div>`).join('')}</div>`;
    }

    function motion(detailId){
      renderCrumbs([{label:theme.drop+' · '+theme.display_name,path:'overview'},{label:'Motion & Effects',path:'motion'}].concat(detailId?[{label:detailId,path:'motion/'+detailId}]:[]));
      const items=[
        {id:'swim',name:theme.motion?.name||'유영',type:'Motion',status:theme.motion?.status,desc:theme.motion?.signature_moment},
        ...(theme.collection_reward?.items||[]).map((x,i)=>({id:i===0?'caustic':'bubble-trail',name:x.name,type:x.type,status:theme.collection_reward?.status,desc:x.rule}))
      ];
      if(detailId){
        const x=items.find(v=>v.id===detailId); if(!x){go('motion');return;}
        const rules=x.id==='swim'?(theme.motion?.rules||[]):[x.desc];
        view.innerHTML=`<div class="panel"><div class="panel-title"><div><div class="kicker">${esc(x.type)}</div><h2>${esc(x.name)}</h2></div><button class="back" onclick="assetBookGo('motion')">← Motion & Effects</button></div>
          <div class="feature-list">${rules.map(r=>'<div class="feature">'+esc(r)+'</div>').join('')}</div><div class="specs" style="margin-top:18px"><div class="spec"><span>Status</span><b>${esc(x.status||'')}</b></div>${x.id==='swim'?'<div class="spec"><span>Runtime base</span><b>'+esc(theme.motion?.runtime_base||'')+'</b></div>':''}</div></div>`;return;
      }
      view.innerHTML=`<div class="head"><div><div class="kicker">Motion & Effects</div><h2>Theme movement</h2></div><div class="note">Motion, Accent, Runtime Effect를 역할별로 분리해 관리합니다.</div></div>
      <div class="card-grid">${items.map(x=>`<article class="card" onclick="assetBookGo('motion/${x.id}')"><small>${esc(x.type)}</small><h3>${esc(x.name)}</h3><p>${esc(x.desc||'')}</p><span class="badge">${esc(x.status||'')}</span></article>`).join('')}</div>`;
    }

    function collection(){
      renderCrumbs([{label:theme.drop+' · '+theme.display_name,path:'overview'},{label:'Collection',path:'collection'}]);
      const initial=theme.initial_shape_pack?.shapes||[];
      view.innerHTML=`<div class="hero"><div class="hero-copy"><div class="eyebrow">Collection Complete</div><h1>Theme<br>Reward</h1><p class="lead">${esc(theme.collection_reward?.unlock||'')}</p><div class="pills"><span class="pill">${esc(theme.collection_reward?.sale||'')}</span></div></div>
      <div class="hero-side"><div class="hero-side-title">Initial Shape Pack</div><div class="overview-grid">${initial.map(s=>'<div class="mini"><b>'+esc(s.name)+'</b><span>'+esc(s.tier)+'</span></div>').join('')}</div></div></div>
      <div class="section"><div class="head"><div><div class="kicker">Rewards</div><h2>Collection unlocks</h2></div></div><div class="card-grid">
      ${(theme.collection_reward?.items||[]).map(x=>`<div class="card wide"><small>${esc(x.type)}</small><h3>${esc(x.name)}</h3><p>${esc(x.rule)}</p><span class="badge">Collection only</span></div>`).join('')}
      ${theme.palette?.signature?`<div class="card full" onclick="assetBookGo('palette/${esc(theme.palette.signature.id)}')"><small>Palette complete</small><h3>${esc(theme.palette.signature.ko)} · Signature Color</h3><p>${esc(theme.palette.signature.rule)}</p><span class="badge">Palette completion reward</span></div>`:''}
      </div></div>`;
    }

    function render(){
      const r=route(), top=r[0];
      renderTabs(top==='shape'?'shapes':top==='background'?'backgrounds':top==='palette'?'palette':top==='motion'?'motion':top);
      if(top==='overview') return overview();
      if(top==='shapes') return shapes();
      if(top==='shape') return shapeDetail(r[1]||'sea-turtle',r[2]||'overview');
      if(top==='backgrounds') return backgrounds();
      if(top==='background') return backgrounds(r[1]);
      if(top==='palette') return palette(r[1]);
      if(top==='motion') return motion(r[1]);
      if(top==='collection') return collection();
      go('overview');
    }
    window.addEventListener('hashchange',render); render();
  })();
  </script>
</body>
</html>
